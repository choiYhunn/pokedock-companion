name: V14 host validation (one-shot branch only)
on:
  push:
    branches: [engineering/v14-production-plan-20261019]
    paths:
      - '.github/workflows/v14_host_validation.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: v14-host-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD for geometry parse/export check
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openscad >/dev/null
      - name: Host C++17, Node UI and OpenSCAD tests
        run: bash scripts/test_host.sh
