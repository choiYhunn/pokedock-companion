<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDock M6 Simulator</title>
<style>
@font-face{font-family:Pretendard;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/woff2/Pretendard-Bold.woff2) format('woff2')}
:root{--ivory:#fbf8f1;--ink:#4a356d;--muted:#7d6c94;--track:#e8dfef;--accent:#7e5bb2;--pill:#f1e6f7;--bg:#efeaf3;--card:#fff;--text:#2c2338}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17141c;--card:#221d29;--text:#ece6f3}}
:root[data-theme=dark]{--bg:#17141c;--card:#221d29;--text:#ece6f3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,'Pretendard','Noto Sans KR',sans-serif;padding:16px}
main{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border-radius:18px;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.note{font-size:13px;opacity:.75}
.holder{display:flex;justify-content:center;overflow:hidden}
#dev{width:466px;height:466px;flex:none;border-radius:50%;background:var(--ivory);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #2e2a36,0 0 0 12px #0004;user-select:none;touch-action:none;cursor:pointer;
  font-family:'Pretendard',system-ui,sans-serif;font-weight:700;transform-origin:top center}
#dev.off{background:#000}#dev.off>*{display:none}
#dev .stage{position:absolute;inset:0}
.lbl{position:absolute;left:0;right:0;text-align:center;line-height:1;white-space:nowrap}
.clock{top:48px;font-size:80px;color:var(--ink);font-variant-numeric:tabular-nums}
.sprite{position:absolute;left:89px;top:119px;width:288px;height:288px;display:flex;align-items:center;justify-content:center}
.sprite img{width:288px;height:288px;image-rendering:pixelated;object-fit:contain}
.ph{width:240px;height:240px;border-radius:50%;background:var(--pill);display:flex;align-items:center;justify-content:center;
  text-align:center;color:var(--muted);font-size:48px;line-height:1.15}
.big{top:118px;font-size:210px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-4px}
.big.mmss{font-size:140px;top:150px;letter-spacing:-3px}
.unit{top:318px;font-size:48px;color:var(--muted)}
.pill{position:absolute;left:50%;transform:translateX(-50%);bottom:46px;background:var(--pill);color:var(--ink);
  border-radius:24px;padding:6px 18px;font-size:48px;white-space:nowrap}
svg.ring{position:absolute;inset:10px;width:446px;height:446px;transform:rotate(-90deg)}
.overlay{position:absolute;inset:0;background:var(--ivory)}
.menu .b{position:absolute;width:170px;height:120px;border-radius:40px;background:var(--pill);color:var(--ink);
  display:flex;align-items:center;justify-content:center;text-align:center;font-size:40px;line-height:1.1}
.eb{position:absolute;border-radius:999px;background:var(--pill);color:var(--ink);display:flex;align-items:center;
  justify-content:center;font-size:40px;line-height:1}
.eb.pm{width:110px;height:110px;top:178px}
.eb.pm i{position:absolute;left:33px;top:50px;width:44px;height:10px;border-radius:5px;background:var(--ink)}
.eb.pm i+i{left:50px;top:33px;width:10px;height:44px}
.eb.nav{width:120px;height:64px;top:351px}
.pill[data-p]{cursor:pointer}
canvas.spr{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;pointer-events:none;z-index:1}
.ov{position:absolute;pointer-events:none;color:var(--accent);font-size:48px;line-height:1;white-space:nowrap;z-index:2;transform:translate(-50%,-50%)}
.ov.small{font-size:30px}
.msg{position:absolute;left:53px;right:53px;top:50%;transform:translateY(-50%);background:#faf1e7;border-radius:28px;
  padding:18px;font-size:30px;line-height:1.35;color:var(--ink);text-align:center;white-space:normal}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
button,select,input{font:inherit}
button{border:0;border-radius:12px;padding:8px 12px;background:#e6dcf3;color:#3b2a57;cursor:pointer}
label{display:inline-flex;gap:6px;align-items:center}
#log{font:12px ui-monospace,monospace;white-space:pre-wrap;max-height:160px;overflow:auto;opacity:.8}
</style>
</head>
<body>
<main>
<section class="card">
  <h1>M6 원형 화면 시뮬레이터</h1>
  <div class="note">466×466 px = Ø36.75 mm. 펌웨어 ui.cpp와 같은 배치·폰트 크기·제스처: 탭 = 반응, 길게(0.6초) = 시작/일시정지, 아래로 끌기 = 메뉴. 메뉴 위쪽 “시간” 또는 “시간 맞춰줘”를 누르면 휴대폰 없이 날짜·시간을 맞추고, 메뉴의 “알람”을 길게 누르면 알람 시각을 바꿉니다. 포켓몬 이미지는 개인 파일이 있을 때만 표시하고, 없으면 중립 자리표시를 보여 줍니다.</div>
  <div class="ctl"><label><input type="checkbox" id="phys"> 실제 크기(96 dpi 기준)</label></div>
  <div class="holder"><div id="dev" role="button" tabindex="0" aria-label="기기 화면"></div></div>
</section>
<section class="card">
  <h2 style="margin-top:0;font-size:16px">앱(BLE) 대신 쓰는 제어판</h2>
  <div class="ctl">
    <button data-act="sync">시간 동기화</button>
    <button data-act="ff1">+1분</button><button data-act="ff10">+10분</button><button data-act="ff60">+1시간</button>
  </div>
  <div class="ctl">
    <label>알람 <input type="time" id="at" value="07:30"></label>
    <label><input type="checkbox" id="aen"> 켜기</label><button data-act="alarm">저장</button>
  </div>
  <div class="ctl">
    <label>파트너 <select id="pt"></select></label>
    <label>USB 전압 <input type="range" id="usb" min="3600" max="5100" step="50" value="4850"><span id="usbv"></span></label>
  </div>
  <div class="ctl"><button data-act="pair">페어링 번호 표시</button><button data-act="msg">숨은 메시지 보기</button></div>
  <div class="ctl"><label>자산 팩(.bin, 이 PC에만) <input type="file" id="packfile" accept=".bin"></label><span id="packinfo">팩 없음: 자리표시</span></div>
  <div id="log" aria-live="polite"></div>
</section>
</main>
<script src="m6_anim.js"></script>
<script>
'use strict';
// --- core logic: JS mirror of v16/masterball-m6/core/pokedock_core.hpp ---------------------------
const GRACE=10, RING_MAX=120000, MAX_AUTO=3, SNOOZE=5, PRESETS=[15,25,45,60], BRIGHT=[20,40,70,100];
const PARTNERS=[[94,'팬텀'],[393,'팽도리'],[468,'토게키스'],[448,'루카리오'],[195,'누오'],[175,'토게피'],[417,'파치리스'],[385,'지라치']];
const S={mono:0, utcOffsetMs:0, trusted:false, tz:540, phase:'idle', total:25*60000, end:0, rem:0, alarm:{en:false,min:450},
  lastFired:-1, armed:-1, ringing:false, ringStart:0, snoozeUntil:-1, auto:0, partner:94, bright:40, preset:1,
  usb:4850, screen:true, lastTouch:0, menu:false, passkey:0, msg:'오늘도 함께하자', taps:0, tapWin:0, react:'', msgUntil:0, completed:0};
const A=window.M6Anim;
S.pack=null;S.dir=new A.Director();S.perf={draws:0,decodes:0,decodeMs:0,since:performance.now(),fps:0};S.dir.trigger(A.PDK.GREET,0); // appear on boot
const nowUtc=()=>Date.now()+S.utcOffsetMs;
// --- clock editor: JS mirror of core/clock_set.hpp -------------------------------------------------
const FW_DATE_UTC=1793372400, YMIN=2026, YMAX=2099, FIELDS=['year','month','day','hour','minute'], UNIT={year:'년',month:'월',day:'일',hour:'시',minute:'분'};
const leap=y=>(y%4===0&&y%100!==0)||y%400===0, dim=(y,m)=>m===2&&leap(y)?29:[31,28,31,30,31,30,31,31,30,31,30,31][m-1];
const wrapv=(v,lo,hi)=>{const n=hi-lo+1;return lo+(((v-lo)%n)+n)%n};
function stepField(t,f,d){t={...t};
  if(f==='year')t.year=wrapv(t.year+d,YMIN,YMAX);if(f==='month')t.month=wrapv(t.month+d,1,12);
  if(f==='day')t.day=wrapv(t.day+d,1,dim(t.year,t.month));if(f==='hour')t.hour=wrapv(t.hour+d,0,23);if(f==='minute')t.minute=wrapv(t.minute+d,0,59);
  t.day=Math.min(t.day,dim(t.year,t.month));return t}
const localToUtc=(t,tz)=>Date.UTC(t.year,t.month-1,t.day,t.hour,t.minute)/1000-tz*60;
function localFromUtc(u,tz){const d=new Date((u+tz*60)*1000);return{year:d.getUTCFullYear(),month:d.getUTCMonth()+1,day:d.getUTCDate(),hour:d.getUTCHours(),minute:d.getUTCMinutes()}}
function openClock(){const base=S.trusted?Math.floor(nowUtc()/1000):Math.max(S.lastSync||0,FW_DATE_UTC);
  S.menu=false;S.edit={alarm:false,fields:FIELDS,fi:0,t:localFromUtc(base,S.tz)};render()}
function openAlarmEditor(){S.menu=false;S.edit={alarm:true,fields:['hour','minute'],fi:0,t:{year:YMIN,month:1,day:1,hour:Math.floor(S.alarm.min/60),minute:S.alarm.min%60}};render()}
function editStep(d){const e=S.edit;e.t=stepField(e.t,e.fields[e.fi],d);render()}
function editNav(dir){const e=S.edit;
  if(dir<0){if(e.fi===0)S.edit=null;else e.fi--;return render()}
  if(e.fi<e.fields.length-1){e.fi++;return render()}
  S.edit=null;
  if(e.alarm){S.alarm={en:true,min:e.t.hour*60+e.t.minute};S.armed=absMin();log(`기기에서 알람 ${e.t.hour}:${e.t.minute}`)}
  else{const u=localToUtc(e.t,S.tz);S.utcOffsetMs=u*1000-Date.now();S.trusted=true;S.lastSync=u;wallClockSet(absMin());
    S.dir.trigger(A.PDK.CELEBRATE,S.mono);log(`기기에서 시간 설정 ${e.t.year}.${e.t.month}.${e.t.day} ${e.t.hour}:${e.t.minute}`)}
  render()}
function wallClockSet(now){if(now<0)return;const today=Math.floor(now/1440);if(S.lastFired>today)S.lastFired=today-1;if(S.armed>now)S.armed=now}
const absMin=()=>S.trusted?Math.floor((nowUtc()/1000+S.tz*60)/60):-1;
const log=t=>{const l=document.getElementById('log');l.textContent=`${new Date(nowUtc()).toISOString().slice(11,19)} ${t}\n`+l.textContent};
function remaining(){return S.phase==='running'?Math.max(0,S.end-S.mono):S.phase==='paused'?S.rem:0}
function startFocus(m){if(S.phase==='running'||S.phase==='paused')return false;S.total=m*60000;S.end=S.mono+S.total;S.phase='running';return true}
function tick(){
  let ev=[];
  if(S.phase==='running'&&S.mono>=S.end){S.phase='done';S.completed++;ev.push('done')}
  if(S.snoozeUntil>=0&&S.mono>=S.snoozeUntil){S.snoozeUntil=-1;S.ringing=true;S.ringStart=S.mono;ev.push('ring')}
  if(S.ringing&&S.mono-S.ringStart>=RING_MAX){S.ringing=false;if(++S.auto>MAX_AUTO){S.auto=0;ev.push('gaveup')}else{S.snoozeUntil=S.mono+SNOOZE*60000;ev.push('autosnooze')}}
  const now=absMin();
  if(now>=0&&S.alarm.en){const today=Math.floor(now/1440);
    for(const d of [today-1,today]){const t=d*1440+S.alarm.min;
      if(d<=S.lastFired||t<=S.armed||now<t||now-t>GRACE)continue;
      S.lastFired=d;if(!S.ringing){S.snoozeUntil=-1;S.auto=0;S.ringing=true;S.ringStart=S.mono;ev.push('ring')}}}
  return ev;
}
// --- device UI (mirrors firmware/main/ui.cpp) --------------------------------------------------------
const dev=document.getElementById('dev');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const name=id=>PARTNERS.find(p=>p[0]===id)[1];
const hasClip=()=>!!A.findClip(S.pack,S.partner,A.PDK.IDLE);
const sprCanvas=()=>`<canvas class="spr" id="spr"></canvas><div class="ov" id="ov"></div>`;
// No pack (or no clip for this partner): the same neutral placeholder as the firmware, never Pokémon art.
function spriteHtml(){return hasClip()?sprCanvas():`<div class="sprite"><div class="ph" data-t="placeholder">포켓몬<br>이미지 필요</div></div>`}
function ring(p,w){const r=223-w/2,C=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 446 446"><circle cx="223" cy="223" r="${r}" fill="none" stroke="var(--track)" stroke-width="${w}"/><circle cx="223" cy="223" r="${r}" fill="none" stroke="var(--accent)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/></svg>`}
function render(){
  if(!S.screen){dev.className='off';dev.innerHTML='';return}
  dev.className='';
  const shift=[[0,0],[2,1],[-1,2],[-2,-1],[1,-2],[3,0],[0,3],[-3,0]][(Math.max(0,absMin())%60)%8];
  const rem=Math.ceil(remaining()/1000), focus=S.phase==='running'||S.phase==='paused';
  let h=`<div class="stage" style="transform:translate(${shift[0]}px,${shift[1]}px)">`;
  if(focus){
    h+=ring(S.total?rem*1000/S.total:0,14);
    if(rem>=600)h+=`<div class="lbl big" data-t="big">${Math.ceil(rem/60)}</div><div class="lbl unit">${S.phase==='paused'?'일시정지':'분 남음'}</div>`;
    else h+=`<div class="lbl big mmss" data-t="big">${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}</div><div class="lbl unit">${S.phase==='paused'?'일시정지':'집중'}</div>`;
    if(hasClip())h+=sprCanvas(); // the cheering partner (director: focus stage); no placeholder at x1
  }else{
    const m=absMin();h+=`<div class="lbl clock" data-t="clock">${m<0?'--:--':String(Math.floor(m%1440/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}</div>`;
    h+=spriteHtml();
    if(S.phase==='done')h+=ring(1,6);
    const st=S.usb<3800?'전원 약함':!S.trusted?'시간 맞춰줘':S.phase==='done'?'수고했어!':'';
    if(st)h+=`<div class="pill" data-t="pill"${!S.trusted&&S.usb>=3800?' data-p="1"':''}>${st}</div>`;
  }
  h+='</div>';
  if(S.ringing&&S.edit)S.edit=null; // a ringing alarm always wins over an unfinished edit
  if(S.ringing)h=`<div class="overlay">${hasClip()?sprCanvas():'<div class="lbl" style="top:64px;font-size:48px;color:var(--accent)">일어날 시간!</div>'}<div class="lbl" style="top:150px;font-size:120px;color:var(--ink)" data-t="alarm">${String(Math.floor(S.alarm.min/60)).padStart(2,'0')}:${String(S.alarm.min%60).padStart(2,'0')}</div><div class="lbl" style="top:300px;font-size:48px;color:var(--muted);line-height:1.15">탭: 5분 뒤<br>길게: 끄기</div></div>`;
  if(S.menu){const f=focus;h+=`<div class="overlay menu"><div class="b" data-m="5" style="left:138px;top:33px;width:190px;height:64px">시간</div>
    <div class="b" data-m="0" style="left:56px;top:93px">${f?'타이머<br>길게: 그만':`타이머<br>${PRESETS[S.preset]}분`}</div>
    <div class="b" data-m="1" style="left:240px;top:93px">${S.alarm.en?`알람<br>${String(Math.floor(S.alarm.min/60)).padStart(2,'0')}:${String(S.alarm.min%60).padStart(2,'0')}`:'알람<br>꺼짐'}</div>
    <div class="b" data-m="2" style="left:56px;top:225px">밝기<br>${S.bright}</div>
    <div class="b" data-m="3" style="left:240px;top:225px">파트너<br>${name(S.partner)}</div>
    <div class="b" data-m="4" style="left:138px;top:369px;width:190px;height:64px">페어링</div></div>`}
  if(S.edit){const e=S.edit,f=e.fields[e.fi],t=e.t,p2=n=>String(n).padStart(2,'0');
    const ctx=f==='hour'||f==='minute'?`${p2(t.hour)}:${p2(t.minute)}`:`${t.year}.${p2(t.month)}.${p2(t.day)}`;
    const big=f==='year'?String(t.year):p2(t[f]), fs=f==='year'?80:120;
    h+=`<div class="overlay edit"><div class="lbl" style="top:53px;font-size:40px;color:var(--muted)">${e.alarm?'알람 시각':'시간 맞추기'}</div>
    <div class="lbl" style="top:113px;font-size:40px;color:var(--accent)" data-t="ctx">${ctx}</div>
    <div class="lbl" style="top:${233-fs/2}px;font-size:${fs}px;color:var(--ink);font-variant-numeric:tabular-nums" data-t="edit">${big}</div>
    <div class="lbl" style="top:291px;font-size:40px;color:var(--muted)">${UNIT[f]}  ${e.fi+1}/${e.fields.length}</div>
    <div class="eb pm" data-e="-1" style="left:13px" aria-label="빼기"><i></i></div><div class="eb pm" data-e="1" style="left:343px" aria-label="더하기"><i></i><i></i></div>
    <div class="eb nav" data-n="-1" style="left:103px">${e.fi===0?'취소':'이전'}</div><div class="eb nav" data-n="1" style="left:243px">${e.fi===e.fields.length-1?'저장':'다음'}</div></div>`}
  if(S.passkey)h+=`<div class="overlay"><div class="lbl" style="top:90px;font-size:48px;color:var(--accent)">페어링</div><div class="lbl" style="top:190px;font-size:80px;color:var(--ink)">${String(S.passkey).padStart(6,'0')}</div><div class="lbl" style="top:330px;font-size:40px;color:var(--muted)">번호를 앱에 입력</div></div>`;
  if(S.msgUntil>S.mono)h+=`<div class="msg" data-t="msg">${esc(S.msg)}</div>`;
  dev.innerHTML=h;
  if(typeof paintPartner==='function')paintPartner();
}
// --- gestures ------------------------------------------------------------------------------------
let downAt=0,downY=0,longFired=false,lpTimer=0;
function dirInput(){const m=absMin();return{now:S.mono,dex:S.partner,ringing:S.ringing,focus:S.phase==='running'||S.phase==='paused',night:m>=0&&(Math.floor(m%1440/60)>=23||Math.floor(m%1440/60)<7),lastTouch:0}}
function wake(){S.dir.touched(dirInput());S.lastTouch=S.mono;if(S.screen)return false;S.screen=true;S.dir.trigger(A.PDK.GREET,S.mono);render();return true}
function tap(){
  if(wake())return;
  if(S.ringing){S.ringing=false;S.snoozeUntil=S.mono+SNOOZE*60000;log('스누즈 5분');return render()}
  if(S.phase==='done'){S.phase='idle';return render()}
  if(S.mono>S.tapWin){S.taps=0;S.tapWin=S.mono+3000}
  if(++S.taps===5){S.msgUntil=S.mono+4500;S.taps=0;S.dir.trigger(A.PDK.EGG,S.mono);log('숨은 메시지');return render()}
  S.dir.trigger(A.PDK.TOUCH,S.mono);log(`${name(S.partner)} 반응`);render();
}
function longPress(){
  if(wake())return;
  if(S.ringing){S.ringing=false;S.snoozeUntil=-1;S.auto=0;log('알람 끔')}
  else if(S.phase==='running'){S.rem=Math.max(0,S.end-S.mono);S.phase='paused';log('일시정지')}
  else if(S.phase==='paused'){S.end=S.mono+S.rem;S.phase='running';log('재개')}
  else{if(S.phase==='done')S.phase='idle';startFocus(PRESETS[S.preset]);log(`집중 ${PRESETS[S.preset]}분 시작`)}
  render();
}
function menuAct(i,long){
  const f=S.phase==='running'||S.phase==='paused';
  if(i===0){if(f){if(long){S.phase='idle';S.menu=false;log('집중 취소')}}else S.preset=(S.preset+1)%4}
  if(i===1&&!long){S.alarm.en=!S.alarm.en;S.armed=absMin()}
  if(i===1&&long)return openAlarmEditor();
  if(i===5&&!long)return openClock();
  if(i===2&&!long)S.bright=BRIGHT.find(b=>b>S.bright)??BRIGHT[0];
  if(i===3&&!long){const k=PARTNERS.findIndex(p=>p[0]===S.partner);S.partner=PARTNERS[(k+1)%8][0];S.dir.trigger(A.PDK.GREET,S.mono)}
  if(i===4&&!long){S.menu=false;S.passkey=100000+Math.floor(Math.random()*900000);setTimeout(()=>{S.passkey=0;render()},8000)}
  render();
}
let rep=0,repeated=false;
dev.addEventListener('pointerdown',e=>{downAt=performance.now();downY=e.clientY;longFired=false;repeated=false;
  const eb=e.target.closest('[data-e]');
  if(S.edit){if(eb){const d=+eb.dataset.e;clearInterval(rep);lpTimer=setTimeout(()=>{repeated=true;rep=setInterval(()=>editStep(d),100)},400)}return}
  const m=e.target.closest('[data-m]');lpTimer=setTimeout(()=>{longFired=true;if(m)menuAct(+m.dataset.m,true);else if(!S.menu)longPress()},600)});
dev.addEventListener('pointerup',e=>{clearTimeout(lpTimer);clearInterval(rep);
  if(S.edit){if(repeated)return;const eb=e.target.closest('[data-e]'),nb=e.target.closest('[data-n]');
    if(eb)editStep(+eb.dataset.e);else if(nb)editNav(+nb.dataset.n);return}
  if(longFired)return;const dy=e.clientY-downY;
  if(e.target.closest('[data-p]')&&!S.menu&&Math.abs(dy)<20){if(!wake())openClock();return}
  if(dy>60&&!S.menu){if(!wake()){S.menu=true;render()}return}
  if(dy<-60&&S.menu){S.menu=false;render();return}
  const m=e.target.closest('[data-m]');if(S.menu){if(m)menuAct(+m.dataset.m,false);return}tap()});
dev.addEventListener('keydown',e=>{if(e.key==='Enter')tap();if(e.key===' ')longPress()});
// --- control panel (stands in for the phone app) -------------------------------------------------------
const pt=document.getElementById('pt');for(const[id,n]of PARTNERS)pt.add(new Option(n,id));
pt.onchange=()=>{S.partner=+pt.value;render()};
const usb=document.getElementById('usb');usb.oninput=()=>{S.usb=+usb.value;document.getElementById('usbv').textContent=`${S.usb} mV`;render()};usb.oninput();
let skew=0;
const actions={sync(){S.trusted=true;log('앱에서 시간 동기화')},ff1(){advance(60000)},ff10(){advance(600000)},ff60(){advance(3600000)},
  alarm(){const[h,m]=document.getElementById('at').value.split(':').map(Number);S.alarm={en:document.getElementById('aen').checked,min:h*60+m};S.armed=absMin();log(`알람 ${h}:${m} ${S.alarm.en?'켬':'끔'}`)},
  pair(){menuAct(4,false)},msg(){S.msgUntil=S.mono+4500}};
for(const b of document.querySelectorAll('[data-act]'))b.onclick=()=>{actions[b.dataset.act]();render()};
function advance(ms){const step=1000;for(let t=0;t<ms;t+=step){S.mono+=step;S.utcOffsetMs+=step;handle(tick())}render()}
function handle(ev){for(const e of ev){if(e==='done'){S.dir.trigger(A.PDK.CELEBRATE,S.mono);S.screen=true;S.lastTouch=S.mono}log({ring:'알람 울림',done:'집중 완료',autosnooze:'자동 스누즈',gaveup:'알람 자동 종료'}[e]);if(e==='ring')S.screen=true}}
document.getElementById('phys').onchange=e=>{dev.style.transform=e.target.checked?`scale(${(36.75/25.4*96)/466})`:'';dev.parentElement.style.height=e.target.checked?'160px':''};
let last=performance.now();
setInterval(()=>{const n=performance.now();S.mono+=n-last;last=n;const ev=tick();handle(ev);
  const busy=S.ringing||S.phase==='running'||S.passkey;if(S.screen&&!busy&&S.mono-S.lastTouch>600000)S.screen=false;
  if(!S.edit||ev.length)render()},250); // the editor is static between touches: no DOM swap under a finger
// --- partner animation: director pose + PDK clip, drawn every animation frame ---------------------
let frameKey='',lastCanvas=null;
const OVTXT=['','\u2665','\u2605','Zzz','!'];
function drawPartner(){paintPartner();requestAnimationFrame(drawPartner)}
function paintPartner(){  // also called right after every DOM rebuild, so a fresh canvas is never blank
  const cv=document.getElementById('spr');
  if(!cv||!S.pack)return;
  if(cv!==lastCanvas){lastCanvas=cv;frameKey=''}
  const shot=S.dir.decide(dirInput());
  const clip=A.findClip(S.pack,S.partner,shot.anim);
  if(clip){
    const idx=Math.floor(shot.t/clip.ms)%clip.frames, key=`${clip.dex}/${clip.anim}/${idx}`;
    if(cv.width!==clip.w||cv.height!==clip.h){cv.width=clip.w;cv.height=clip.h;frameKey=''}
    if(key!==frameKey){const t0=performance.now();const px=A.decodeFrame(S.pack,clip,idx);S.perf.decodes++;S.perf.decodeMs+=performance.now()-t0;
      if(px){cv.getContext('2d').putImageData(new ImageData(px,clip.w,clip.h),0,0);frameKey=key}}
    const r=A.place(shot.stage,clip.w,clip.h,shot.pose);
    Object.assign(cv.style,{left:`${233+r.x}px`,top:`${233+r.y}px`,width:`${r.w}px`,height:`${r.h}px`});
    cv.dataset.stage=shot.stage;cv.dataset.anim=shot.anim;cv.dataset.zoom=r.zoom;
    const ov=document.getElementById('ov'),p=shot.pose;
    if(ov){ov.textContent=p.overlay&&p.overlayOpa?OVTXT[p.overlay]:'';ov.className='ov'+(p.overlay===A.OV.HEART||p.overlay===A.OV.SPARKLE?' small':'');
      ov.style.opacity=p.overlayOpa/255;ov.style.left=`${233+r.x+Math.trunc(r.w*4/5)}px`;ov.style.top=`${233+r.y+12+p.overlayDy}px`}
  }
  S.perf.draws++;const now=performance.now();if(now-S.perf.since>=1000){S.perf.fps=S.perf.draws*1000/(now-S.perf.since);S.perf.draws=0;S.perf.since=now}
}
requestAnimationFrame(drawPartner);
const b64=(s)=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function loadPack(bytes){S.pack=A.readPack(bytes);frameKey='';document.getElementById('packinfo').textContent=S.pack?`팩 ${S.pack.clips.length}개 클립`:'팩 형식 오류';render();return !!S.pack}
function loadMessageSlot(bytes){const b=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  if(String.fromCharCode(b[0],b[1],b[2],b[3])!=='PDM1')return false;const n=b[4]|(b[5]<<8);if(!n||n>90)return false;
  if(S.msg==='오늘도 함께하자')S.msg=new TextDecoder().decode(b.slice(6,6+n));return true}
document.getElementById('packfile').onchange=async e=>{const f=e.target.files[0];if(f)loadPack(new Uint8Array(await f.arrayBuffer()))};
window.PD={S,tick,advance,tap,longPress,menuAct,render,absMin,remaining,openClock,openAlarmEditor,editStep,editNav,stepField,localToUtc,
  loadPack:(s)=>loadPack(b64(s)),loadMessageSlot:(s)=>loadMessageSlot(b64(s)),dirInput};
render();
</script>
