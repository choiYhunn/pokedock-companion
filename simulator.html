function alarm(){return shell('<div class="grid split"><div class="card"><span class="eyebrow">MORNING CENTER</span><div class="medium">Alarm</div><div class="rowlist">'+[['07:30','평일'],['08:10','화/목'],['22:20','Night prep']].map((a,i)=>'<button class="row" data-action="alarm" data-id="'+i+'"><span><strong>'+a[0]+'</strong> · '+a[1]+'</span><b class="'+(S.alarms[i]?'done':'')+'">'+(S.alarms[i]?'ON':'OFF')+'</b></button>').join('')+'</div></div><div class="card">'+pokemon(175,'small')+'<div class="copy" style="width:58%;position:relative;z-index:4"><span class="eyebrow">TOGEPI MORNING</span><div class="medium">Wake-up Buddy</div><div class="speech">좋은 아침! 첫 퀘스트부터 가볍게 시작해보자.</div></div></div></div>')}
function light(){const themes=[['warm','Togepi Warm',175],['electric','Pachirisu Spark',417],['calm','Togekiss Calm',468],['night','Gengar Night',94]];return shell('<div class="card" style="height:100%"><span class="eyebrow">AMBIENT THEMES</span><div class="medium">Pokémon Light</div><div class="badge-grid" style="grid-template-columns:repeat(4,1fr);margin-top:1cqw">'+themes.map(t=>'<button class="badge click '+(S.lightTheme===t[0]?'':'')+'" data-action="theme" data-id="'+t[0]+'" style="height:20cqw;opacity:'+(S.lightTheme===t[0]?1:.58)+'"><img src="'+P(t[2])+'" style="width:8cqw;height:8cqw;object-fit:contain"><b>'+t[1]+'</b></button>').join('')+'</div></div>')}
function settings(){return shell('<div class="grid split"><div class="card"><span class="eyebrow">DISPLAY</span><div class="rowlist"><div class="row"><span>Brightness</span><b>'+S.brightness+'%</b></div><div class="actionbar"><button class="btn" data-action="brightness" data-id="-10">−</button><button class="btn" data-action="brightness" data-id="10">+</button></div><button class="row" data-action="night"><span>Night Mode</span><b class="'+(S.night?'done':'')+'">'+(S.night?'ON':'OFF')+'</b></button><button class="row" data-action="random"><span>Random Encounter</span><b class="'+(S.randomEncounter?'done':'')+'">'+(S.randomEncounter?'ON':'OFF')+'</b></button></div></div><div class="card"><span class="eyebrow">CONNECTIVITY</span><div class="rowlist"><div class="row"><span>Wi‑Fi</span><b class="done">CONNECTED</b></div><button class="row" data-action="ble-toggle"><span>BLE Bridge</span><b class="'+(S.ble?'done':'')+'">'+(S.ble?'ON':'OFF')+'</b></button><div class="row"><span>NFC side</span><b>RIGHT</b></div><div class="row"><span>Web settings</span><b>READY</b></div></div></div></div>')}
function birthday(){return top()+'<div class="page" style="padding:0">'+birthdayBody()+'</div>'+bottom()+drawer()+notice()+reward()+detail()}
function birthdayBody(){return '<div class="birthday"><div><span class="chip">WISH EVENT · ONE DAY ONLY</span><img src="'+P(385)+'"><h2>Jirachi has appeared.</h2><p>오늘의 소원 리본이 해금되었습니다 ✦</p><div class="actionbar" style="justify-content:center"><button class="btn pokeball" data-action="wish">WISH RIBBON</button><button class="btn" data-screen="home">CENTER</button></div></div></div>'}
const views={home,focus,quests,dex,trainer,timer,stopwatch,stats,badges,egg,nfc,phone,weather,alarm,light,settings,birthday};
function encounter(){S.encounters++;S.reward=ENCOUNTERS[S.encounters%ENCOUNTERS.length];S.rewardShiny=(S.encounters%8===0);if(!S.caught.includes(S.reward))S.caught.push(S.reward);if(S.rewardShiny&&!S.shiny.includes(S.reward))S.shiny.push(S.reward)}
function studyReward(){S.sessions++;S.exp+=25;S.bond=Math.min(100,S.bond+2);S.egg+=8;if(S.exp>=S.partnerLevel*30){S.exp-=S.partnerLevel*30;S.partnerLevel++}if(S.egg>=100){S.egg-=100;S.reward=280;if(!S.caught.includes(280))S.caught.push(280)}else if(S.randomEncounter)encounter();if(S.sessions>=5&&!S.badges.includes('ROUTINE'))S.badges.push('ROUTINE')}
function render(){theme();const el=$('screen');el.classList.toggle('night',S.night||S.lightTheme==='night');el.style.filter='brightness('+(0.65+S.brightness/200)+')';el.innerHTML=(views[S.screen]||home)();document.querySelectorAll('#review button').forEach(b=>b.classList.toggle('active',b.dataset.screen===S.screen))}
function nav(screen){S.screen=screen;S.drawer=false;S.menuGroup=null;S.detail=null;render()}
function act(a,b){if(a==='drawer'){S.drawer=!S.drawer;if(!S.drawer)S.menuGroup=null;render()}else if(a==='menu-group'){S.menuGroup=b.dataset.id;render()}else if(a==='menu-back'){S.menuGroup=null;render()}else if(a==='dismiss-notice'){S.notice=null;render()}else if(a==='partner'){const seq=[468,448,94,417,175,385];S.partner=seq[(seq.indexOf(S.partner)+1)%seq.length];render()}else if(a==='bond'){S.bond=Math.min(100,S.bond+5);render()}else if(a==='focus-toggle'){S.focusRun=!S.focusRun;render()}else if(a==='focus-plus'){S.focus+=300;render()}else if(a==='focus-reset'){S.focus=1500;S.focusRun=false;render()}else if(a==='focus-clear'){S.focus=0;S.focusRun=false;studyReward();render()}else if(a==='timer-toggle'){S.countRun=!S.countRun;render()}else if(a==='timer-reset'){S.count=600;S.countRun=false;render()}else if(a==='preset'){S.count=Number(b.dataset.id);S.countRun=false;render()}else if(a==='sw-toggle'){S.swRun=!S.swRun;render()}else if(a==='lap'){S.laps.unshift(S.sw);render()}else if(a==='sw-reset'){S.sw=0;S.swRun=false;S.laps=[];render()}else if(a==='quest'){const i=Number(b.dataset.id);S.quests[i]=!S.quests[i];render()}else if(a==='egg-plus'){S.egg+=20;if(S.egg>=100){S.egg-=100;S.reward=280;if(!S.caught.includes(280))S.caught.push(280)}render()}else if(a==='nfc-scan'){const seq=[94,417,448,468];S.nfcId=seq[((seq.indexOf(S.nfcId)+1)||0)%seq.length];if(!S.nfcId)S.nfcId=94;render()}else if(a==='nfc-partner'){if(PARTNERS[S.nfcId])S.partner=S.nfcId;nav('home')}else if(a==='phone-toggle'){S.phone=!S.phone;render()}else if(a==='ble-toggle'){S.ble=!S.ble;render()}else if(a==='notify'){S.ble=true;S.notice=b.dataset.id;render()}else if(a==='alarm'){const i=Number(b.dataset.id);S.alarms[i]=!S.alarms[i];render()}else if(a==='theme'){S.lightTheme=b.dataset.id;if(S.lightTheme==='night')S.night=true;render()}else if(a==='night'){S.night=!S.night;render()}else if(a==='random'){S.randomEncounter=!S.randomEncounter;render()}else if(a==='brightness'){S.brightness=Math.max(30,Math.min(100,S.brightness+Number(b.dataset.id)));render()}else if(a==='register'){S.reward=null;S.rewardShiny=false;nav('dex')}else if(a==='close-detail'){S.detail=null;render()}else if(a==='set-partner'){S.partner=Number(b.dataset.id);S.detail=null;nav('home')}else if(a==='wish'){if(!S.badges.includes('WISH'))S.badges.push('WISH');S.bond=Math.min(100,S.bond+10);nav('trainer')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){nav(b.dataset.screen);return}if(b.dataset.pokemon){S.detail=Number(b.dataset.pokemon);render();return}if(b.dataset.action){act(b.dataset.action,b);return}});
setInterval(()=>{let d=false;if(S.focusRun&&S.focus>0){S.focus--;d=S.screen==='focus';if(S.focus===0){S.focusRun=false;studyReward();d=true}}if(S.countRun&&S.count>0){S.count--;d=d||S.screen==='timer'}if(S.swRun){S.sw++;d=d||S.screen==='stopwatch'}if(d)render()},1000);
$('resetBtn').onclick=()=>location.reload();
$('fullBtn').onclick=()=>{const el=document.querySelector('.device-shell');if(document.fullscreenElement)document.exitFullscreen();else el.requestFullscreen?.()};
$('review').innerHTML=screenOrder.map(x=>'<button data-screen="'+x+'">'+labels[x]+'</button>').join('');
render();
})();
</script>
</body>
</html>
