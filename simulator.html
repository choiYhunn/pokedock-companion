<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDock Simulator V3</title>
<style>
:root{--bg:#1f232b;--panel:#292e37;--line:#3a414c;--screen:#f7f3e9;--ink:#24262c;--muted:#74777e;--accent:#9dc4de;--accent-soft:#e7f2f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f1;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h1{font-size:21px;margin:0}.health{font:11px ui-monospace,monospace;color:#7fe094}
.layout{display:grid;grid-template-columns:160px minmax(0,1fr) 190px;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px}
.nav button,.controls button{width:100%;border:1px solid transparent;background:#343a45;color:#d9dde3;border-radius:9px;padding:9px;margin:3px 0;text-align:left;font-size:11px;cursor:pointer;touch-action:manipulation}
.nav button.active{background:#f3f1eb;color:#22252a;font-weight:800}.controls button:active{background:#4b5360;transform:translateY(1px)}
.shell{background:linear-gradient(145deg,#efefec,#d8d9d8);border-radius:20px;padding:10px;box-shadow:0 20px 40px #0005}.screen{aspect-ratio:5/3;background:var(--screen);color:var(--ink);border-radius:13px;overflow:hidden;position:relative}.screen.dark{background:#181720;color:#f6f4fb}
.bar{height:12%;display:flex;justify-content:space-between;align-items:center;padding:0 3%;font-size:11px;position:relative;z-index:5}.brand{font-weight:900;letter-spacing:.11em}.brand:before{content:"";display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:5px;background:linear-gradient(#db6265 0 44%,#292b31 44% 57%,#fff 57%)}
.status{display:flex;gap:9px;color:#777b83}.dark .status{color:#aaa6b1}
.content{height:76%;padding:2.5%;display:grid;grid-template-columns:1.5fr .9fr;gap:2%;position:relative}.card{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.9);border-radius:15px;padding:4%;overflow:hidden;position:relative;box-shadow:0 8px 20px #0000000b}.dark .card{background:#ffffff10;border-color:#ffffff0d;box-shadow:none}
.time{font-size:clamp(35px,7vw,66px);font-weight:950;letter-spacing:-.065em;line-height:.95}.big{font-size:clamp(40px,8vw,76px);font-weight:950;letter-spacing:-.06em;line-height:1}.sub{color:var(--muted);font-size:12px}.dark .sub{color:#aaa6b1}
.stack{display:grid;grid-template-rows:repeat(4,1fr);gap:4%}.mini{padding:8%}.mini b{display:block;font-size:12px}.mini span{font-size:10px;color:var(--muted)}
.bottom{height:12%;border-top:1px solid #0001;display:flex;align-items:center;justify-content:center;gap:5px;background:#ffffff36}.bottom button{border:0;background:transparent;padding:6px 9px;border-radius:8px;color:#777;font-size:10px}.bottom button.active{background:#fff;color:#222;font-weight:800}.dark .bottom{background:#ffffff06;border-top-color:#ffffff0c}.dark .bottom button.active{background:#ffffff18;color:white}
.poke-art{position:absolute;right:0;bottom:0;width:44%;height:82%;object-fit:contain;filter:drop-shadow(0 10px 9px #0002);z-index:1}.poke-art.small{width:38%;height:67%}.poke-art.center{position:static;width:70%;height:70%;max-height:210px}.poke-name{position:absolute;right:4%;top:6%;font-size:10px;font-weight:900;letter-spacing:.12em;color:#7a7c83;z-index:2}
.hero-copy{position:relative;z-index:3;max-width:53%}.quote{font-size:16px;font-weight:850;margin-top:30px}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--accent-soft);color:#46677d;font-size:9px;font-weight:800}
.glow{position:absolute;width:210px;height:210px;border-radius:50%;right:-25px;bottom:-30px;background:radial-gradient(circle,var(--accent-soft),transparent 68%);z-index:0}
.alert{position:absolute;right:3%;top:13%;z-index:20;background:#20242de8;color:white;border-radius:9px;padding:9px 11px;min-width:180px;box-shadow:0 10px 20px #0003}.alert b{display:block;font-size:11px}.alert span{font-size:10px;color:#c9cdd3}
.reward{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:70%;background:#20242df2;color:white;border-radius:16px;padding:18px;text-align:center;box-shadow:0 20px 40px #0005}.reward img{width:120px;height:120px;object-fit:contain}.reward h3{margin:4px 0}.reward p{font-size:11px;color:#c9cdd3}
.state{margin-top:9px;padding:9px;background:#15181e;border-radius:9px;color:#9ea6b1;font:10px/1.5 ui-monospace,monospace;white-space:pre-line}.badge{display:inline-block;padding:4px 7px;background:var(--accent-soft);color:#42576d;border-radius:999px;font-size:9px}.list{display:grid;gap:7px}.row{padding:9px;background:#ffffffaa;border-radius:9px;font-size:11px;display:flex;justify-content:space-between;gap:8px}.dark .row{background:#ffffff10}.birthday{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 43%,#344879,#111827 70%);color:white;position:relative;overflow:hidden}.birthday:before,.birthday:after{content:"✦";position:absolute;color:#f0d66a;font-size:80px;opacity:.25}.birthday:before{left:12%;top:18%}.birthday:after{right:12%;bottom:16%}.birthday img{width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 0 24px #f1d96a88)}.birthday h2{font-size:28px;margin:4px}.phone{width:68px;height:124px;border-radius:13px;background:#222831;margin:auto;display:grid;place-items:center;color:#7fe094;font-size:27px}.ok{color:#7fe094}.off{color:#e0aa82}
button[data-ui]{border:0;border-radius:8px;padding:8px 12px}.dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dex-mon{background:#ffffffa8;border-radius:10px;padding:5px;text-align:center;font-size:9px;color:#6e7178}.dex-mon img{width:100%;height:70px;object-fit:contain}.dark .dex-mon{background:#ffffff10;color:#aaa6b1}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme-card{min-height:90px;border-radius:11px;padding:9px;background:#ffffffaa;position:relative;overflow:hidden}.theme-card img{position:absolute;right:0;bottom:-5px;width:65px;height:65px;object-fit:contain}.theme-card b{font-size:11px}.theme-card span{font-size:9px;color:#777}
@media(max-width:820px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:9px}.controls{display:grid;grid-template-columns:repeat(2,1fr)}.controls h3,.state{grid-column:1/-1}.shell{padding:6px}.bar{font-size:8px}.mini span{font-size:9px}.content{padding:2%}.quote{font-size:12px}.poke-art{width:46%;height:74%}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><h1>PokéDock UI Simulator <span style="color:#8eb9d3;font-size:12px">V3 Pokémon Theme</span></h1><span class="health" id="health">BOOTING</span></div>
<div class="layout">
  <aside class="panel nav" id="nav"></aside>
  <main><div class="shell"><div class="screen" id="screen"></div></div></main>
  <aside class="panel controls" id="controls">
    <h3 style="font-size:12px;margin:4px 4px 8px">State simulator</h3>
    <button data-action="phone">폰 거치 토글</button>
    <button data-action="ble">BLE 연결/해제</button>
    <button data-action="call">BLE · 전화 알림</button>
    <button data-action="calendar">BLE · 일정 알림</button>
    <button data-action="contact">BLE · 중요 연락처</button>
    <button data-action="dark">Night 토글</button>
    <button data-action="nfc">NFC 스캔</button>
    <button data-action="encounter">Random Encounter</button>
    <button data-action="birthday">Birthday 이벤트</button>
    <button data-action="reset">상태 초기화</button>
    <div class="state" id="state">booting…</div>
  </aside>
</div>
</div>
<script>
(function(){
"use strict";
const P=id=>"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png";
const MON={
 calm:{id:468,name:"TOGEKISS",accent:"#9dc4de",soft:"#e7f2f8"},
 morning:{id:175,name:"TOGEPI",accent:"#f2c0a7",soft:"#fff0e9"},
 charge:{id:417,name:"PACHIRISU",accent:"#7cbce6",soft:"#e3f3fd"},
 focus:{id:448,name:"LUCARIO",accent:"#53759a",soft:"#dfe9f3"},
 night:{id:94,name:"GENGAR",accent:"#7a5aa8",soft:"#e8e0f3"},
 birthday:{id:385,name:"JIRACHI",accent:"#e4c65e",soft:"#fff5bf"}
};
const extended=[25,37,39,54,133,143,196,197,258,280,447,492,570,700,702,778];
const S={screen:"home",phone:true,ble:true,dark:false,notice:null,nfc:false,focus:1500,focusRun:false,count:600,countRun:false,sw:1938,swRun:false,clicks:0,reward:null,encounter:0};
const ids=["home","focus","timer","stopwatch","today","stats","dex","nfc","phone","weather","alarm","light","settings","birthday","night"];
const L={home:"HOME",focus:"FOCUS",timer:"TIMER",stopwatch:"STOPWATCH",today:"TODAY",stats:"STATS",dex:"DEX",nfc:"NFC",phone:"PHONE",weather:"WEATHER",alarm:"ALARM",light:"LIGHT",settings:"SETTINGS",birthday:"BIRTHDAY",night:"NIGHT"};
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function role(){
 if(S.screen==="focus")return MON.focus;
 if(S.screen==="phone"&&S.phone)return MON.charge;
 if(S.screen==="birthday")return MON.birthday;
 if(S.screen==="night"||S.dark)return MON.night;
 if(S.screen==="alarm")return MON.morning;
 if(S.screen==="nfc"&&S.nfc)return MON.night;
 return MON.calm;
}
function applyTheme(m){document.documentElement.style.setProperty("--accent",m.accent);document.documentElement.style.setProperty("--accent-soft",m.soft)}
function art(m,cls=""){return '<img class="poke-art '+cls+'" src="'+P(m.id)+'" alt="'+m.name+'"><div class="poke-name">'+m.name+'</div><div class="glow"></div>'}
function notice(){if(!S.notice)return "";const m={call:["CALL · 엄마","수신 전화"],calendar:["CALENDAR","15분 뒤 일정"],contact:["PRIORITY","선택 연락처 · 본문 숨김"]}[S.notice];return '<div class="alert"><b>'+m[0]+'</b><span>'+m[1]+'</span></div>'}
function reward(){if(!S.reward)return "";const id=S.reward;return '<div class="reward"><div class="chip">STUDY REWARD</div><img src="'+P(id)+'"><h3>Wild encounter!</h3><p>Focus 완료 보상으로 새로운 포켓몬을 만났어요.</p><button data-ui="reward-close">도감에 등록</button></div>'}
function top(){return '<div class="bar"><div class="brand">POKÉDOCK</div><div class="status"><span>Wi-Fi ●</span><span>'+(S.ble?"BLE ●":"BLE ○")+'</span><span>'+(S.phone?"PHONE ●":"PHONE ○")+'</span></div></div>'}
function bottom(active){return '<div class="bottom">'+["home","focus","timer","today","dex"].map(x=>'<button data-screen="'+x+'" class="'+(active===x?"active":"")+'">'+L[x]+'</button>').join("")+'</div>'}
function shell(body,active,dark){return '<div style="height:100%" class="'+(dark?"dark":"")+'">'+top()+'<div class="content">'+body+'</div>'+bottom(active)+notice()+reward()+'</div>'}
function home(){
 const m=S.dark?MON.night:MON.calm;applyTheme(m);
 return shell('<div class="card">'+art(m)+'<div class="hero-copy"><div class="time">14:36</div><div class="sub">10월 5일 · 월요일</div><div class="quote">'+(S.dark?"밤이 됐다. 화면은 조용하게.":"오늘도 차근차근.")+'</div><div class="sub">'+(S.dark?"Gengar Night Mode":"Togekiss Calm Mode")+'</div></div></div><div class="stack"><div class="card mini"><b>오늘 공부</b><span>1h45m / 3h</span></div><div class="card mini"><b>D-DAY</b><span>확률 과제 D-4</span></div><div class="card mini"><b>날씨</b><span>18°C 맑음</span></div><div class="card mini"><b>다음</b><span>복습 25분</span></div></div>',"home",S.dark)}
function focus(){
 const m=MON.focus;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="chip">LUCARIO FOCUS</div><div class="big">'+fmt(S.focus)+'</div><div class="sub">집중하면 Study EXP +25</div><div style="margin-top:10px"><button data-ui="focus">'+(S.focusRun?"PAUSE":"START")+'</button> <button data-ui="focus-complete">DEMO COMPLETE</button></div></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>Focus Buddy</h3><p class="sub">일반 알림과 랜덤 이벤트를 막고 중요한 것만 남깁니다.</p></div></div>',"focus",S.dark)}
function timer(){
 const m=MON.morning;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="chip">TOGEPI TIMER</div><div class="big">'+fmt(S.count)+'</div><button data-ui="timer">'+(S.countRun?"PAUSE":"START")+'</button></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>Presets</h3><div class="list"><div class="row"><span>5분</span><b>QUICK</b></div><div class="row"><span>10분</span><b>DEFAULT</b></div><div class="row"><span>30분</span><b>LONG</b></div></div></div></div>',"timer",S.dark)}
function stopwatch(){
 const m=MON.focus;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="chip">TRAINING LOG</div><div class="big">'+fmt(S.sw)+'</div><button data-ui="sw">'+(S.swRun?"PAUSE":"START")+'</button> <button data-ui="lap">LAP</button></div></div><div class="card"><h3>Recent Laps</h3><div class="list"><div class="row"><span>Lap 3</span><b>32:18</b></div><div class="row"><span>Lap 2</span><b>21:04</b></div><div class="row"><span>Lap 1</span><b>10:12</b></div></div></div>',"timer",S.dark)}
function today(){
 const m=MON.calm;applyTheme(m);
 return shell('<div class="card"><h3>Trainer Tasks</h3><div class="list"><div class="row"><span>✓ 신호 복습 25분</span><b class="ok">DONE</b></div><div class="row"><span>확률 과제</span><b>18:00</b></div><div class="row"><span>영단어 20개</span><b>20:30</b></div></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><div class="big">1h45m</div><div class="sub">3 sessions · 4-day streak</div><div class="quote">오늘 목표 58%</div></div></div>',"today",S.dark)}
function stats(){
 const m=MON.morning;applyTheme(m);
 return shell('<div class="card"><h3>Weekly Study</h3><div class="big">8h20m</div><div class="sub">12 sessions · +18% vs last week</div><div class="list" style="margin-top:12px"><div class="row"><span>Mon</span><b>1h10</b></div><div class="row"><span>Tue</span><b>2h05</b></div><div class="row"><span>Wed</span><b>0h45</b></div></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>4 day streak</h3><p class="sub">다음 encounter까지 Focus 1회</p></div></div>',"today",S.dark)}
function dex(){
 applyTheme(MON.calm);
 const mons=[94,175,417,448,468,385,25,133];
 return shell('<div class="card" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0 0 8px">PokéDex · 11 / 18</h3><span class="chip">Study EXP 285</span></div><div class="dex-grid">'+mons.map((id,i)=>'<div class="dex-mon"><img src="'+P(id)+'"><b>'+(i<6?"FOUND":"LOCKED")+'</b></div>').join("")+'</div></div>',"dex",S.dark)}
function nfc(){
 const m=S.nfc?MON.night:MON.charge;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div style="font-size:50px">'+(S.nfc?"✓":"◉")+'</div><h3>'+(S.nfc?"Gengar registered":"측면 NFC에 태그/피규어")+'</h3><p class="sub">NFC side pod</p></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>'+(S.nfc?"Gengar Theme":"NFC Encounter")+'</h3><p class="sub">'+(S.nfc?"Night buddy 테마를 불러왔습니다.":"태그별 companion과 preset을 저장할 수 있습니다.")+'</p></div></div>',"dex",S.dark)}
function phone(){
 const m=MON.charge;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center"><div class="phone">⚡</div><div class="chip" style="margin-top:8px">PACHIRISU CHARGE</div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>Phone Bridge</h3><p class="'+(S.ble?"ok":"off")+'">'+(S.ble?"BLE connected":"BLE disconnected")+'</p><div class="list"><div class="row"><span>CALL</span><b>ALLOW</b></div><div class="row"><span>CALENDAR</span><b>ALLOW</b></div><div class="row"><span>SOCIAL</span><b>SUPPRESS</b></div></div></div></div>',"home",S.dark)}
function weather(){
 const m=MON.calm;applyTheme(m);
 return shell('<div class="card"><div class="chip">SUWON · NOW</div><div class="big">18°</div><div class="sub">맑음 · 체감 17° · 습도 48%</div><div class="list" style="margin-top:12px"><div class="row"><span>18시</span><b>16°</b></div><div class="row"><span>21시</span><b>13°</b></div></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>좋은 날씨!</h3><p class="sub">날씨는 홈 companion의 표정/대사에도 반영.</p></div></div>',"home",S.dark)}
function alarm(){
 const m=MON.morning;applyTheme(m);
 return shell('<div class="card"><h3>Alarm</h3><div class="list"><div class="row"><span>07:30 · 평일</span><b>ON</b></div><div class="row"><span>08:10 · 화/목</span><b>ON</b></div><div class="row"><span>22:20 · 매일</span><b>ON</b></div></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>Togepi Morning</h3><p class="sub">알람이 울릴 때 토게피와 부드러운 화면/사운드.</p></div></div>',"home",S.dark)}
function light(){
 applyTheme(MON.calm);
 return shell('<div class="card" style="grid-column:1/-1"><h3>Pokémon Light Themes</h3><div class="theme-grid"><div class="theme-card" style="background:#fff0e9"><b>Warm · Togepi</b><span>아침 / 독서</span><img src="'+P(175)+'"></div><div class="theme-card" style="background:#e3f3fd"><b>Electric · Pachirisu</b><span>충전</span><img src="'+P(417)+'"></div><div class="theme-card" style="background:#e7f2f8"><b>Calm · Togekiss</b><span>평상시</span><img src="'+P(468)+'"></div><div class="theme-card" style="background:#e8e0f3"><b>Night · Gengar</b><span>야간</span><img src="'+P(94)+'"></div></div></div>',"home",S.dark)}
function settings(){
 applyTheme(MON.calm);
 return shell('<div class="card"><h3>Device</h3><div class="list"><div class="row"><span>Auto brightness</span><b>ON</b></div><div class="row"><span>Night start</span><b>22:30</b></div><div class="row"><span>NFC side</span><b>RIGHT</b></div></div></div><div class="card"><h3>Connectivity</h3><div class="list"><div class="row"><span>Wi-Fi</span><b>CONNECTED</b></div><div class="row"><span>BLE Bridge</span><b>'+(S.ble?"ON":"OFF")+'</b></div><div class="row"><span>Web Settings</span><b>READY</b></div></div></div>',"home",S.dark)}
function birthday(){
 applyTheme(MON.birthday);
 return '<div class="birthday"><div><div class="chip">SPECIAL EVENT</div><img src="'+P(385)+'"><h2>A SPECIAL EVENT HAS STARTED.</h2><p>오늘만 열리는 아주 희귀한 이벤트 ✦</p><button data-ui="close-bday">오늘의 포켓몬 센터 열기</button></div></div>'}
function night(){const o=S.dark;S.dark=true;const x=home();S.dark=o;return x}
const F={home,focus,timer,stopwatch,today,stats,dex,nfc,phone,weather,alarm,light,settings,birthday,night};
function render(){
 applyTheme(role());
 $("screen").innerHTML=(F[S.screen]||home)();
 $("screen").classList.toggle("dark",S.dark||S.screen==="night");
 $("state").textContent="clicks: "+S.clicks+"\nscreen: "+S.screen+"\nphoneParked: "+S.phone+"\nBLE: "+S.ble+"\nnotice: "+(S.notice||"none")+"\nnight: "+S.dark+"\nnfc: "+S.nfc+"\nencounters: "+S.encounter;
 $("health").textContent="RUNNING";
 drawNav();
}
function drawNav(){$("nav").innerHTML=ids.map(x=>'<button data-screen="'+x+'" class="'+(S.screen===x?"active":"")+'">'+L[x]+'</button>').join("")}
function encounter(){S.encounter++;S.reward=extended[S.encounter%extended.length]}
function act(a){
 S.clicks++;
 if(a==="phone")S.phone=!S.phone;
 else if(a==="ble")S.ble=!S.ble;
 else if(a==="call"){S.ble=true;S.notice="call";S.screen="phone"}
 else if(a==="calendar"){S.ble=true;S.notice="calendar";S.screen="phone"}
 else if(a==="contact"){S.ble=true;S.notice="contact";S.screen="phone"}
 else if(a==="dark")S.dark=!S.dark;
 else if(a==="nfc"){S.nfc=!S.nfc;S.screen="nfc"}
 else if(a==="encounter"){encounter()}
 else if(a==="birthday")S.screen="birthday";
 else if(a==="reset")Object.assign(S,{screen:"home",phone:true,ble:true,dark:false,notice:null,nfc:false,focus:1500,focusRun:false,count:600,countRun:false,sw:1938,swRun:false,clicks:S.clicks,reward:null,encounter:0});
 render();
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.action){act(b.dataset.action);return}
 if(b.dataset.screen){S.screen=b.dataset.screen;render();return}
 if(b.dataset.ui==="focus"){S.focusRun=!S.focusRun;render();return}
 if(b.dataset.ui==="focus-complete"){S.focus=0;S.focusRun=false;encounter();render();return}
 if(b.dataset.ui==="timer"){S.countRun=!S.countRun;render();return}
 if(b.dataset.ui==="sw"){S.swRun=!S.swRun;render();return}
 if(b.dataset.ui==="lap"){render();return}
 if(b.dataset.ui==="reward-close"){S.reward=null;S.screen="dex";render();return}
 if(b.dataset.ui==="close-bday"){S.screen="home";render();return}
});
setInterval(()=>{
 let d=false;
 if(S.focusRun&&S.focus>0){S.focus--;d=S.screen==="focus";if(S.focus===0){S.focusRun=false;encounter();d=true}}
 if(S.countRun&&S.count>0){S.count--;d=d||S.screen==="timer"}
 if(S.swRun){S.sw++;d=d||S.screen==="stopwatch"}
 if(d)render();
},1000);
window.addEventListener("error",e=>{$("health").textContent="ERROR";$("state").textContent="runtime error: "+e.message});
render();
})();
</script>
</body>
</html>
