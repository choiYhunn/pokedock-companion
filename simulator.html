<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDock Simulator V3</title>
<style>
:root{--bg:#1f232b;--panel:#292e37;--line:#3a414c;--screen:#f7f3e9;--ink:#24262c;--muted:#74777e;--accent:#9dc4de;--accent-soft:#e7f2f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f4f1;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h1{font-size:21px;margin:0}.health{font:11px ui-monospace,monospace;color:#7fe094}
.layout{display:grid;grid-template-columns:160px minmax(0,1fr) 190px;gap:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:9px}
.nav button,.controls button{width:100%;border:1px solid transparent;background:#343a45;color:#d9dde3;border-radius:9px;padding:9px;margin:3px 0;text-align:left;font-size:11px;cursor:pointer;touch-action:manipulation}
.nav button.active{background:#f3f1eb;color:#22252a;font-weight:800}.controls button:active{background:#4b5360;transform:translateY(1px)}
.shell{background:linear-gradient(145deg,#efefec,#d8d9d8);border-radius:20px;padding:10px;box-shadow:0 20px 40px #0005}.screen{aspect-ratio:5/3;background:var(--screen);color:var(--ink);border-radius:13px;overflow:hidden;position:relative}.screen.dark{background:#181720;color:#f6f4fb}
.bar{height:12%;display:flex;justify-content:space-between;align-items:center;padding:0 3%;font-size:11px;position:relative;z-index:5}.brand{font-weight:900;letter-spacing:.11em}.brand:before{content:"";display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:5px;background:linear-gradient(#db6265 0 44%,#292b31 44% 57%,#fff 57%)}
.status{display:flex;gap:9px;color:#777b83}.dark .status{color:#aaa6b1}
.content{height:76%;padding:2.5%;display:grid;grid-template-columns:1.5fr .9fr;gap:2%;position:relative}.card{background:rgba(255,255,255,.84);border:1px solid rgba(255,255,255,.9);border-radius:15px;padding:4%;overflow:hidden;position:relative;box-shadow:0 8px 20px #0000000b}.dark .card{background:#ffffff10;border-color:#ffffff0d;box-shadow:none}
.time{font-size:clamp(35px,7vw,66px);font-weight:950;letter-spacing:-.065em;line-height:.95}.big{font-size:clamp(40px,8vw,76px);font-weight:950;letter-spacing:-.06em;line-height:1}.sub{color:var(--muted);font-size:12px}.dark .sub{color:#aaa6b1}
.stack{display:grid;grid-template-rows:repeat(4,1fr);gap:4%}.mini{padding:8%}.mini b{display:block;font-size:12px}.mini span{font-size:10px;color:var(--muted)}
.bottom{height:12%;border-top:1px solid #0001;display:flex;align-items:center;justify-content:center;gap:5px;background:#ffffff36}.bottom button{border:0;background:transparent;padding:6px 9px;border-radius:8px;color:#777;font-size:10px}.bottom button.active{background:#fff;color:#222;font-weight:800}.dark .bottom{background:#ffffff06;border-top-color:#ffffff0c}.dark .bottom button.active{background:#ffffff18;color:white}
.poke-art{position:absolute;right:0;bottom:0;width:44%;height:82%;object-fit:contain;filter:drop-shadow(0 10px 9px #0002);z-index:1}.poke-art.small{width:38%;height:67%}.poke-art.center{position:static;width:70%;height:70%;max-height:210px}.poke-name{position:absolute;right:4%;top:6%;font-size:10px;font-weight:900;letter-spacing:.12em;color:#7a7c83;z-index:2}
.hero-copy{position:relative;z-index:3;max-width:53%}.quote{font-size:16px;font-weight:850;margin-top:30px}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:var(--accent-soft);color:#46677d;font-size:9px;font-weight:800}
.glow{position:absolute;width:210px;height:210px;border-radius:50%;right:-25px;bottom:-30px;background:radial-gradient(circle,var(--accent-soft),transparent 68%);z-index:0}
.alert{position:absolute;right:3%;top:13%;z-index:20;background:#20242de8;color:white;border-radius:9px;padding:9px 11px;min-width:180px;box-shadow:0 10px 20px #0003}.alert b{display:block;font-size:11px}.alert span{font-size:10px;color:#c9cdd3}
.reward{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;width:70%;background:#20242df2;color:white;border-radius:16px;padding:18px;text-align:center;box-shadow:0 20px 40px #0005}.reward img{width:120px;height:120px;object-fit:contain}.reward h3{margin:4px 0}.reward p{font-size:11px;color:#c9cdd3}
.state{margin-top:9px;padding:9px;background:#15181e;border-radius:9px;color:#9ea6b1;font:10px/1.5 ui-monospace,monospace;white-space:pre-line}.badge{display:inline-block;padding:4px 7px;background:var(--accent-soft);color:#42576d;border-radius:999px;font-size:9px}.list{display:grid;gap:7px}.row{padding:9px;background:#ffffffaa;border-radius:9px;font-size:11px;display:flex;justify-content:space-between;gap:8px}.dark .row{background:#ffffff10}.birthday{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 43%,#344879,#111827 70%);color:white;position:relative;overflow:hidden}.birthday:before,.birthday:after{content:"✦";position:absolute;color:#f0d66a;font-size:80px;opacity:.25}.birthday:before{left:12%;top:18%}.birthday:after{right:12%;bottom:16%}.birthday img{width:190px;height:190px;object-fit:contain;filter:drop-shadow(0 0 24px #f1d96a88)}.birthday h2{font-size:28px;margin:4px}.phone{width:68px;height:124px;border-radius:13px;background:#222831;margin:auto;display:grid;place-items:center;color:#7fe094;font-size:27px}.ok{color:#7fe094}.off{color:#e0aa82}
button[data-ui]{border:0;border-radius:8px;padding:8px 12px}.dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dex-mon{background:#ffffffa8;border-radius:10px;padding:5px;text-align:center;font-size:9px;color:#6e7178}.dex-mon img{width:100%;height:70px;object-fit:contain}.dark .dex-mon{background:#ffffff10;color:#aaa6b1}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.theme-card{min-height:90px;border-radius:11px;padding:9px;background:#ffffffaa;position:relative;overflow:hidden}.theme-card img{position:absolute;right:0;bottom:-5px;width:65px;height:65px;object-fit:contain}.theme-card b{font-size:11px}.theme-card span{font-size:9px;color:#777}
@media(max-width:820px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:9px}.controls{display:grid;grid-template-columns:repeat(2,1fr)}.controls h3,.state{grid-column:1/-1}.shell{padding:6px}.bar{font-size:8px}.mini span{font-size:9px}.content{padding:2%}.quote{font-size:12px}.poke-art{width:46%;height:74%}}

/* Pokemon fan-system layer */
.screen:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(circle at 1px 1px,var(--accent) 1px,transparent 1.2px);background-size:18px 18px}
.type-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.type-chip{display:inline-block;padding:3px 7px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.05em;color:white;background:#70757e}
.type-fairy{background:#d889bd}.type-flying{background:#859bd7}.type-fighting{background:#b84c45}.type-steel{background:#778a9a}.type-ghost{background:#69558c}.type-poison{background:#9550a3}.type-electric{background:#d6aa27;color:#382e0b}.type-normal{background:#8e8d83}.type-psychic{background:#dc6581}.type-dark{background:#4e4657}.type-grass{background:#70a85c}
.partner-title{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:900;letter-spacing:.08em}.partner-title:before{content:"";width:14px;height:14px;border-radius:50%;background:linear-gradient(#dc6265 0 44%,#262a30 44% 57%,#fff 57%);box-shadow:0 1px 3px #0002}
.bond{display:flex;align-items:center;gap:5px;font-size:10px;margin-top:7px}.bond strong{color:#d46883}.meter{height:7px;background:#dce0e1;border-radius:99px;overflow:hidden;margin-top:4px}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f0d56a);border-radius:99px}
.speech{margin-top:10px;max-width:56%;padding:8px 10px;background:#ffffffcf;border-radius:11px 11px 11px 2px;font-size:11px;font-weight:750;line-height:1.35;position:relative;z-index:4}.dark .speech{background:#ffffff12}
.quest-tag{font-size:8px;font-weight:900;letter-spacing:.08em;color:#58728a}.quest-done{color:#5c9867;font-weight:900}
.trainer-card{background:linear-gradient(145deg,#28364d,#172235)!important;color:white;border-color:#41536b!important}.trainer-card .sub{color:#c5ccd5}.trainer-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:10px;height:100%}.trainer-art{position:relative;overflow:hidden}.trainer-art>img{position:absolute;right:-4%;bottom:-8%;width:62%;height:88%;object-fit:contain;filter:drop-shadow(0 10px 9px #0004)}
.rank{font-size:9px;letter-spacing:.14em;color:#d3af36;font-weight:900}.trainer-name{font-size:25px;font-weight:950;letter-spacing:-.04em}.statline{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ffffff18;font-size:10px}
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fan-badge{min-height:78px;border-radius:13px;background:#ffffffb8;display:grid;place-items:center;text-align:center;padding:7px}.fan-badge .medal{width:36px;height:36px;border-radius:12px;transform:rotate(45deg);background:linear-gradient(145deg,var(--badge,#8eb9d3),#fff);box-shadow:inset 0 0 0 3px #ffffff9c,0 4px 10px #0001}.fan-badge b{font-size:9px;margin-top:4px}
.egg-wrap{display:grid;place-items:center;height:100%;text-align:center}.egg{width:100px;height:125px;border-radius:52% 48% 45% 45%;background:radial-gradient(circle at 35% 30%,#f5c77d 0 8%,transparent 9%),radial-gradient(circle at 67% 57%,#8fc4e1 0 9%,transparent 10%),radial-gradient(circle at 40% 75%,#d893bc 0 7%,transparent 8%),#fff7dc;box-shadow:inset -10px -12px 0 #efe4bf,0 14px 18px #0002;animation:eggBob 2.8s ease-in-out infinite}@keyframes eggBob{50%{transform:translateY(-5px) rotate(2deg)}}
.dex-mon.locked img{filter:grayscale(1) brightness(.15);opacity:.42}.dex-mon.shiny:before{content:"✦";position:absolute;right:5px;top:4px;color:#d5aa21;font-size:14px;z-index:3}.dex-no{display:block;font-size:7px;color:#8a8c91}.dex-types{display:block;font-size:7px;color:#6d7076}
.reward.shiny{background:linear-gradient(145deg,#252943,#171a2c);box-shadow:0 0 35px #f0d56a55}.reward.shiny:before{content:"✦ SHINY";display:block;color:#f0d56a;font-size:10px;font-weight:900;letter-spacing:.15em}
.center-mark{position:absolute;left:4%;top:7%;font-size:9px;font-weight:900;letter-spacing:.12em;color:#73808b}
.poke-ball-btn{background:linear-gradient(#dc6265 0 44%,#262a30 44% 57%,#fff 57%)!important;color:#222!important;border:2px solid #262a30!important;font-weight:900}

</style>
</head>
<body>
<div class="wrap">
<div class="head"><h1>PokéDock UI Simulator <span style="color:#8eb9d3;font-size:12px">V3 Pokémon Theme</span></h1><span class="health" id="health">BOOTING</span></div>
<div class="layout">
  <aside class="panel nav" id="nav"></aside>
  <main><div class="shell"><div class="screen" id="screen"></div></div></main>
  <aside class="panel controls" id="controls">
    <h3 style="font-size:12px;margin:4px 4px 8px">State simulator</h3>
    <button data-action="phone">폰 거치 토글</button>
    <button data-action="ble">BLE 연결/해제</button>
    <button data-action="call">BLE · 전화 알림</button>
    <button data-action="calendar">BLE · 일정 알림</button>
    <button data-action="contact">BLE · 중요 연락처</button>
    <button data-action="dark">Night 토글</button>
    <button data-action="nfc">NFC 스캔</button>
    <button data-action="encounter">Random Encounter</button>
    <button data-action="partner">파트너 교체</button>
    <button data-action="bond">파트너 간식 / Bond +5</button>
    <button data-action="egg">Egg progress +20%</button>
    <button data-action="birthday">Birthday 이벤트</button>
    <button data-action="reset">상태 초기화</button>
    <div class="state" id="state">booting…</div>
  </aside>
</div>
</div>
<script>
(function(){
"use strict";
const P=id=>"https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/"+id+".png";
const MON={
 calm:{id:468,name:"TOGEKISS",accent:"#9dc4de",soft:"#e7f2f8"},
 morning:{id:175,name:"TOGEPI",accent:"#f2c0a7",soft:"#fff0e9"},
 charge:{id:417,name:"PACHIRISU",accent:"#7cbce6",soft:"#e3f3fd"},
 focus:{id:448,name:"LUCARIO",accent:"#53759a",soft:"#dfe9f3"},
 night:{id:94,name:"GENGAR",accent:"#7a5aa8",soft:"#e8e0f3"},
 birthday:{id:385,name:"JIRACHI",accent:"#e4c65e",soft:"#fff5bf"}
};
const extended=[25,37,39,54,133,143,196,197,258,280,447,492,570,700,702,778];
const S={screen:"home",phone:true,ble:true,dark:false,notice:null,nfc:false,focus:1500,focusRun:false,count:600,countRun:false,sw:1938,swRun:false,clicks:0,reward:null,rewardShiny:false,encounter:0,partner:468,partnerLevel:12,bond:67,exp:285,egg:42,sessions:3,streak:4,rank:"ACE SCHOLAR",badges:["FOCUS","STREAK"],caught:[94,175,417,448,468,385,25,133,778]};
const ids=["home","focus","quests","timer","stopwatch","today","stats","trainer","badges","egg","dex","nfc","phone","weather","alarm","light","settings","birthday","night"];
const L={home:"CENTER",focus:"TRAIN",quests:"QUEST",timer:"TIMER",stopwatch:"STOPWATCH",today:"TODAY",stats:"RECORD",trainer:"TRAINER",badges:"BADGES",egg:"EGG",dex:"DEX",nfc:"NFC",phone:"PHONE",weather:"WEATHER",alarm:"ALARM",light:"LIGHT",settings:"SETTINGS",birthday:"BIRTHDAY",night:"NIGHT"};
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const PARTNERS={
  468:{id:468,name:"Togekiss",role:"CALM",types:["FAIRY","FLYING"],quote:"오늘도 좋은 일이 생길 것 같아."},
  448:{id:448,name:"Lucario",role:"FOCUS",types:["FIGHTING","STEEL"],quote:"마음을 가다듬고 한 세션만."},
  94:{id:94,name:"Gengar",role:"NIGHT",types:["GHOST","POISON"],quote:"밤에는 내가 지켜볼게."},
  417:{id:417,name:"Pachirisu",role:"CHARGE",types:["ELECTRIC"],quote:"전기 모으는 중! 폰은 잠깐 잊자."},
  175:{id:175,name:"Togepi",role:"MORNING",types:["FAIRY"],quote:"오늘의 첫 퀘스트부터 가볍게!"},
  385:{id:385,name:"Jirachi",role:"WISH",types:["STEEL","PSYCHIC"],quote:"한 번 더 해내면 소원에 가까워져."}
};
const DEX=[
{id:94,name:"Gengar",types:"GHOST / POISON"},{id:175,name:"Togepi",types:"FAIRY"},{id:417,name:"Pachirisu",types:"ELECTRIC"},{id:448,name:"Lucario",types:"FIGHTING / STEEL"},
{id:468,name:"Togekiss",types:"FAIRY / FLYING"},{id:385,name:"Jirachi",types:"STEEL / PSYCHIC"},{id:25,name:"Pikachu",types:"ELECTRIC"},{id:133,name:"Eevee",types:"NORMAL"},
{id:778,name:"Mimikyu",types:"GHOST / FAIRY"},{id:700,name:"Sylveon",types:"FAIRY"},{id:197,name:"Umbreon",types:"DARK"},{id:492,name:"Shaymin",types:"GRASS"}
];
function partner(){return PARTNERS[S.partner]||PARTNERS[468]}
function typeClass(t){return "type-"+t.toLowerCase().replaceAll(" ","-")}
function typesHtml(types){return '<div class="type-row">'+types.map(t=>'<span class="type-chip '+typeClass(t)+'">'+t+'</span>').join("")+'</div>'}
function bondHtml(){return '<div class="bond"><strong>♥ BOND '+S.bond+'</strong><span>Lv.'+S.partnerLevel+'</span></div><div class="meter"><i style="width:'+Math.min(100,S.bond)+'%"></i></div>'}
function studyReward(){S.sessions++;S.exp+=25;S.bond=Math.min(100,S.bond+2);S.egg=Math.min(100,S.egg+8);if(S.exp>=S.partnerLevel*30){S.partnerLevel++;S.exp=0}if(S.sessions>=5&&!S.badges.includes("ROUTINE"))S.badges.push("ROUTINE");encounter()}

function role(){
 if(S.screen==="focus")return MON.focus;
 if(S.screen==="phone"&&S.phone)return MON.charge;
 if(S.screen==="birthday")return MON.birthday;
 if(S.screen==="night"||S.dark)return MON.night;
 if(S.screen==="alarm")return MON.morning;
 if(S.screen==="nfc"&&S.nfc)return MON.night;
 return MON.calm;
}
function applyTheme(m){document.documentElement.style.setProperty("--accent",m.accent);document.documentElement.style.setProperty("--accent-soft",m.soft)}
function art(m,cls=""){return '<img class="poke-art '+cls+'" src="'+P(m.id)+'" alt="'+m.name+'"><div class="poke-name">'+m.name+'</div><div class="glow"></div>'}
function notice(){if(!S.notice)return "";const m={call:["CALL · 엄마","수신 전화"],calendar:["CALENDAR","15분 뒤 일정"],contact:["PRIORITY","선택 연락처 · 본문 숨김"]}[S.notice];return '<div class="alert"><b>'+m[0]+'</b><span>'+m[1]+'</span></div>'}
function reward(){
 if(!S.reward)return "";
 const d=DEX.find(x=>x.id===S.reward)||{id:S.reward,name:"Unknown",types:"???"};
 return '<div class="reward '+(S.rewardShiny?"shiny":"")+'"><div class="chip">STUDY REWARD · +25 EXP</div><img src="'+P(d.id)+'"><h3>'+(S.rewardShiny?"Shiny ":"")+d.name+' encountered!</h3><p>'+d.types+' · Focus 완료 보상</p><button data-ui="reward-close" class="poke-ball-btn">REGISTER</button></div>';
}
function top(){return '<div class="bar"><div class="brand">POKÉDOCK</div><div class="status"><span>Wi-Fi ●</span><span>'+(S.ble?"BLE ●":"BLE ○")+'</span><span>'+(S.phone?"PHONE ●":"PHONE ○")+'</span></div></div>'}
function bottom(active){return '<div class="bottom">'+["home","focus","quests","dex","trainer"].map(x=>'<button data-screen="'+x+'" class="'+(active===x?"active":"")+'">'+L[x]+'</button>').join("")+'</div>'}
function shell(body,active,dark){return '<div style="height:100%" class="'+(dark?"dark":"")+'">'+top()+'<div class="content">'+body+'</div>'+bottom(active)+notice()+reward()+'</div>'}
function home(){
 const p=partner(); const m=S.dark?MON.night:MON.calm; applyTheme(m);
 return shell('<div class="card trainer-art"><div class="center-mark">PARTNER CENTER · ACTIVE PARTNER</div><img src="'+P(p.id)+'"><div class="hero-copy" style="padding-top:16px"><div class="partner-title">#'+String(p.id).padStart(3,"0")+' '+p.name.toUpperCase()+'</div>'+typesHtml(p.types)+bondHtml()+'<div class="speech">'+p.quote+'</div><div style="margin-top:12px"><span class="chip">'+S.rank+'</span> <span class="chip">EXP '+S.exp+'</span></div></div></div><div class="stack"><div class="card mini"><span class="quest-tag">DAILY QUEST</span><b>Focus 5회</b><span>'+S.sessions+'/5 · 다음 Badge</span></div><div class="card mini"><span class="quest-tag">EGG</span><b>부화 진행 '+S.egg+'%</b><div class="meter"><i style="width:'+S.egg+'%"></i></div></div><div class="card mini"><span class="quest-tag">DEX</span><b>'+S.caught.length+' caught</b><span>Encounter '+S.encounter+'회</span></div><div class="card mini"><span class="quest-tag">NEXT QUEST</span><b>확률 과제 D-4</b><span>18:00</span></div></div>',"home",S.dark)}
function focus(){
 const p=PARTNERS[448];const m=MON.focus;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="partner-title" style="justify-content:center">AURA TRAINING · LUCARIO</div>'+typesHtml(p.types)+'<div class="big">'+fmt(S.focus)+'</div><div class="sub">Study EXP +25 · Bond +2 · Egg +8%</div><div style="margin-top:10px"><button data-ui="focus" class="poke-ball-btn">'+(S.focusRun?"PAUSE":"START")+'</button> <button data-ui="focus-complete">DEMO CLEAR</button></div></div></div><div class="card trainer-art"><img src="'+P(448)+'"><div class="hero-copy"><span class="rank">TRAINING PARTNER</span><h3>Lucario</h3><div class="speech">흐트러지지 말고, 지금 이 한 세션만.</div><div class="meter"><i style="width:'+Math.min(100,(1500-S.focus)/15)+'%"></i></div><p class="sub">완료 시 encounter roll + Quest 진행</p></div></div>',"focus",S.dark)}
function timer(){
 const m=MON.morning;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="chip">TOGEPI TIMER</div><div class="big">'+fmt(S.count)+'</div><button data-ui="timer">'+(S.countRun?"PAUSE":"START")+'</button></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>Presets</h3><div class="list"><div class="row"><span>5분</span><b>QUICK</b></div><div class="row"><span>10분</span><b>DEFAULT</b></div><div class="row"><span>30분</span><b>LONG</b></div></div></div></div>',"timer",S.dark)}
function stopwatch(){
 const m=MON.focus;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="chip">TRAINING LOG</div><div class="big">'+fmt(S.sw)+'</div><button data-ui="sw">'+(S.swRun?"PAUSE":"START")+'</button> <button data-ui="lap">LAP</button></div></div><div class="card"><h3>Recent Laps</h3><div class="list"><div class="row"><span>Lap 3</span><b>32:18</b></div><div class="row"><span>Lap 2</span><b>21:04</b></div><div class="row"><span>Lap 1</span><b>10:12</b></div></div></div>',"timer",S.dark)}
function today(){
 applyTheme(MON.calm);
 return shell('<div class="card"><div class="partner-title">TODAY QUEST LOG</div><div class="list" style="margin-top:8px"><div class="row"><span><b>MAIN</b> 확률 과제</span><span>D-4</span></div><div class="row"><span><b>SIDE</b> 신호 복습 25분</span><span class="quest-done">CLEAR</span></div><div class="row"><span><b>DAILY</b> Focus 3회</span><span>'+Math.min(3,S.sessions)+'/3</span></div><div class="row"><span><b>BONUS</b> 영단어 20개</span><span>20:30</span></div></div></div><div class="card trainer-art"><img src="'+P(468)+'"><div class="hero-copy"><span class="rank">DAILY PROGRESS</span><div class="big">1h45m</div><div class="sub">'+S.sessions+' sessions · '+S.streak+'-day streak</div><div class="meter"><i style="width:58%"></i></div><div class="speech">퀘스트 두 개만 더 깨면 오늘 목표 완료!</div></div></div>',"quests",S.dark)}
function quests(){return today()}
function stats(){
 applyTheme(MON.morning);
 return shell('<div class="card"><span class="rank">TRAINER RECORD</span><div class="big">8h20m</div><div class="sub">THIS WEEK · 12 TRAINING SESSIONS</div><div class="list" style="margin-top:12px"><div class="row"><span>Mon</span><b>1h10</b></div><div class="row"><span>Tue</span><b>2h05</b></div><div class="row"><span>Wed</span><b>0h45</b></div></div></div><div class="card trainer-art"><img src="'+P(partner().id)+'"><div class="hero-copy"><span class="rank">'+S.rank+'</span><h3>'+S.streak+' DAY STREAK</h3><p class="sub">Study EXP '+S.exp+' · Badges '+S.badges.length+'</p><div class="speech">꾸준함도 트레이너의 실력.</div></div></div>',"trainer",S.dark)}
function dex(){
 applyTheme(MON.calm);
 return shell('<div class="card" style="grid-column:1/-1"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="partner-title">POKÉDEX</div><div class="sub">CAUGHT '+S.caught.length+' · STUDY EXP '+S.exp+'</div></div><span class="chip">NEXT ENCOUNTER: TRAIN</span></div><div class="dex-grid" style="margin-top:8px">'+DEX.map(d=>{const caught=S.caught.includes(d.id);return '<div class="dex-mon '+(caught?"":"locked")+'"><span class="dex-no">No.'+String(d.id).padStart(3,"0")+'</span><img src="'+P(d.id)+'"><b>'+d.name+'</b><span class="dex-types">'+d.types+'</span></div>'}).join("")+'</div></div>',"dex",S.dark)}
function nfc(){
 const m=S.nfc?MON.night:MON.charge;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="partner-title" style="justify-content:center">NFC SUMMON</div><div style="font-size:50px">'+(S.nfc?"✓":"◉")+'</div><h3>'+(S.nfc?"Gengar recognized":"측면 포드에 피규어/태그")+'</h3><p class="sub">태그 = 파트너 + 테마 + preset</p></div></div><div class="card trainer-art"><img src="'+P(S.nfc?94:417)+'"><div class="hero-copy"><span class="rank">'+(S.nfc?"REGISTERED TAG":"WAITING")+'</span><h3>'+(S.nfc?"Gengar":"NFC Encounter")+'</h3><p class="sub">'+(S.nfc?"Night Buddy · Ghost theme · 야간 Focus bonus":"포켓몬별 전용 대사와 화면을 호출")+'</p>'+(S.nfc?'<button data-ui="set-scanned-partner">PARTNER로 지정</button>':'')+'</div></div>',"dex",S.dark)}
function phone(){
 const m=MON.charge;applyTheme(m);
 return shell('<div class="card" style="display:grid;place-items:center"><div class="phone">⚡</div><div class="partner-title" style="margin-top:8px">PACHIRISU CHARGE</div><div class="sub">'+(S.phone?"후면 Qi 충전 중":"폰 없음")+'</div></div><div class="card trainer-art"><img src="'+P(417)+'"><div class="hero-copy"><span class="rank">PHONE BRIDGE · PRIVACY FIRST</span><h3>Priority Relay</h3><p class="'+(S.ble?"ok":"off")+'">'+(S.ble?"BLE connected":"BLE disconnected")+'</p><div class="list"><div class="row"><span>CALL</span><b>ALLOW</b></div><div class="row"><span>CALENDAR</span><b>ALLOW</b></div><div class="row"><span>SOCIAL</span><b>SUPPRESS</b></div></div></div></div>',"home",S.dark)}
function weather(){
 const m=MON.calm;applyTheme(m);
 return shell('<div class="card"><div class="chip">SUWON · NOW</div><div class="big">18°</div><div class="sub">맑음 · 체감 17° · 습도 48%</div><div class="list" style="margin-top:12px"><div class="row"><span>18시</span><b>16°</b></div><div class="row"><span>21시</span><b>13°</b></div></div></div><div class="card">'+art(m,"small")+'<div class="hero-copy"><h3>좋은 날씨!</h3><p class="sub">날씨는 홈 companion의 표정/대사에도 반영.</p></div></div>',"home",S.dark)}
function alarm(){
 const m=MON.morning;applyTheme(m);
 return shell('<div class="card"><div class="partner-title">MORNING CENTER</div><div class="list" style="margin-top:8px"><div class="row"><span>07:30 · 평일</span><b>ON</b></div><div class="row"><span>08:10 · 화/목</span><b>ON</b></div><div class="row"><span>22:20 · Night prep</span><b>ON</b></div></div></div><div class="card trainer-art"><img src="'+P(175)+'"><div class="hero-copy"><span class="rank">TOGEPI MORNING</span><h3>Wake-up Buddy</h3><div class="speech">좋은 아침! 오늘 첫 퀘스트부터 가볍게 시작해보자.</div></div></div>',"home",S.dark)}
function trainer(){
 const p=partner();applyTheme(MON.calm);
 return shell('<div class="trainer-grid" style="grid-column:1/-1"><div class="card trainer-card trainer-art"><img src="'+P(p.id)+'"><div class="hero-copy"><span class="rank">'+S.rank+'</span><div class="trainer-name">TRAINER PROFILE</div><div class="sub">PARTNER · '+p.name+' Lv.'+S.partnerLevel+'</div>'+typesHtml(p.types)+'<div style="margin-top:12px">'+bondHtml()+'</div></div></div><div class="card"><h3>Trainer Card</h3><div class="statline"><span>Study EXP</span><b>'+S.exp+'</b></div><div class="statline"><span>Sessions</span><b>'+S.sessions+'</b></div><div class="statline"><span>Streak</span><b>'+S.streak+' days</b></div><div class="statline"><span>Pokédex</span><b>'+S.caught.length+' caught</b></div><div class="statline"><span>Badges</span><b>'+S.badges.length+'</b></div><button data-action="partner" style="margin-top:9px">파트너 교체</button> <button data-screen="badges" style="margin-top:9px">BADGES</button></div></div>',"trainer",S.dark)}
function badges(){
 applyTheme(MON.morning);
 const all=[["FOCUS","#6c8dac"],["STREAK","#e29b65"],["ROUTINE","#8eae7c"],["NIGHT","#725b96"],["DEX","#d889bd"],["WISH","#e0c255"]];
 return shell('<div class="card" style="grid-column:1/-1"><div class="partner-title">TRAINER BADGES</div><p class="sub">PokéDock 전용 공부 업적 배지. 공부 루프가 실제 수집 요소로 남습니다.</p><div class="badge-grid">'+all.map(b=>'<div class="fan-badge" style="opacity:'+(S.badges.includes(b[0])?1:.28)+'"><div class="medal" style="--badge:'+b[1]+'"></div><b>'+b[0]+'</b></div>').join("")+'</div></div>',"trainer",S.dark)}
function egg(){
 applyTheme(MON.morning);
 return shell('<div class="card egg-wrap"><div><div class="egg"></div><h3>Mystery Egg</h3><div class="meter"><i style="width:'+S.egg+'%"></i></div><p class="sub">Focus 완료 +8% · '+S.egg+'%</p><button data-action="egg">DEMO +20%</button></div></div><div class="card trainer-art"><img src="'+P(175)+'"><div class="hero-copy"><span class="rank">HATCH RESEARCH</span><h3>부화 조건</h3><div class="list"><div class="row"><span>Focus 25m</span><b>+8%</b></div><div class="row"><span>7-day streak</span><b>BONUS</b></div><div class="row"><span>NFC special</span><b>?</b></div></div></div></div>',"trainer",S.dark)}
function light(){
 applyTheme(MON.calm);
 return shell('<div class="card" style="grid-column:1/-1"><h3>Pokémon Light Themes</h3><div class="theme-grid"><div class="theme-card" style="background:#fff0e9"><b>Warm · Togepi</b><span>아침 / 독서</span><img src="'+P(175)+'"></div><div class="theme-card" style="background:#e3f3fd"><b>Electric · Pachirisu</b><span>충전</span><img src="'+P(417)+'"></div><div class="theme-card" style="background:#e7f2f8"><b>Calm · Togekiss</b><span>평상시</span><img src="'+P(468)+'"></div><div class="theme-card" style="background:#e8e0f3"><b>Night · Gengar</b><span>야간</span><img src="'+P(94)+'"></div></div></div>',"home",S.dark)}
function settings(){
 applyTheme(MON.calm);
 return shell('<div class="card"><h3>Device</h3><div class="list"><div class="row"><span>Auto brightness</span><b>ON</b></div><div class="row"><span>Night start</span><b>22:30</b></div><div class="row"><span>NFC side</span><b>RIGHT</b></div></div></div><div class="card"><h3>Connectivity</h3><div class="list"><div class="row"><span>Wi-Fi</span><b>CONNECTED</b></div><div class="row"><span>BLE Bridge</span><b>'+(S.ble?"ON":"OFF")+'</b></div><div class="row"><span>Web Settings</span><b>READY</b></div></div></div>',"home",S.dark)}
function birthday(){
 applyTheme(MON.birthday);
 return '<div class="birthday"><div><div class="chip">WISH EVENT · ONE DAY ONLY</div><img src="'+P(385)+'"><h2>Jirachi has appeared.</h2><p>오늘의 소원 리본이 해금되었습니다 ✦</p><div style="display:flex;gap:8px;justify-content:center"><button data-ui="birthday-ribbon">WISH RIBBON</button><button data-ui="close-bday">CENTER로 돌아가기</button></div></div></div>'}
function night(){const o=S.dark;S.dark=true;const x=home();S.dark=o;return x}
const F={home,focus,quests,timer,stopwatch,today,stats,trainer,badges,egg,dex,nfc,phone,weather,alarm,light,settings,birthday,night};
function render(){
 applyTheme(role());
 $("screen").innerHTML=(F[S.screen]||home)();
 $("screen").classList.toggle("dark",S.dark||S.screen==="night");
 $("state").textContent="clicks: "+S.clicks+"\nscreen: "+S.screen+"\nphoneParked: "+S.phone+"\nBLE: "+S.ble+"\nnotice: "+(S.notice||"none")+"\nnight: "+S.dark+"\nnfc: "+S.nfc+"\nencounters: "+S.encounter+"\npartner: "+partner().name+" Lv."+S.partnerLevel+"\nbond: "+S.bond+"\nexp: "+S.exp+"\negg: "+S.egg+"%\nbadges: "+S.badges.join(",");
 $("health").textContent="RUNNING";
 drawNav();
}
function drawNav(){$("nav").innerHTML=ids.map(x=>'<button data-screen="'+x+'" class="'+(S.screen===x?"active":"")+'">'+L[x]+'</button>').join("")}
function encounter(){S.encounter++;S.reward=extended[S.encounter%extended.length];S.rewardShiny=(S.encounter%8===0);if(!S.caught.includes(S.reward))S.caught.push(S.reward)}
function act(a){
 S.clicks++;
 if(a==="phone")S.phone=!S.phone;
 else if(a==="ble")S.ble=!S.ble;
 else if(a==="call"){S.ble=true;S.notice="call";S.screen="phone"}
 else if(a==="calendar"){S.ble=true;S.notice="calendar";S.screen="phone"}
 else if(a==="contact"){S.ble=true;S.notice="contact";S.screen="phone"}
 else if(a==="dark")S.dark=!S.dark;
 else if(a==="nfc"){S.nfc=!S.nfc;S.screen="nfc"}
 else if(a==="encounter"){encounter()}
 else if(a==="partner"){const seq=[468,448,94,417,175,385];S.partner=seq[(seq.indexOf(S.partner)+1)%seq.length]}
 else if(a==="bond"){S.bond=Math.min(100,S.bond+5)}
 else if(a==="egg"){S.egg=Math.min(100,S.egg+20);if(S.egg>=100){S.reward=280;S.rewardShiny=false;if(!S.caught.includes(280))S.caught.push(280);S.egg=0}}
 else if(a==="birthday")S.screen="birthday";
 else if(a==="reset")Object.assign(S,{screen:"home",phone:true,ble:true,dark:false,notice:null,nfc:false,focus:1500,focusRun:false,count:600,countRun:false,sw:1938,swRun:false,clicks:S.clicks,reward:null,rewardShiny:false,encounter:0,partner:468,partnerLevel:12,bond:67,exp:285,egg:42,sessions:3,streak:4,rank:"ACE SCHOLAR",badges:["FOCUS","STREAK"],caught:[94,175,417,448,468,385,25,133,778]});
 render();
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.action){act(b.dataset.action);return}
 if(b.dataset.screen){S.screen=b.dataset.screen;render();return}
 if(b.dataset.ui==="focus"){S.focusRun=!S.focusRun;render();return}
 if(b.dataset.ui==="focus-complete"){S.focus=0;S.focusRun=false;studyReward();render();return}
 if(b.dataset.ui==="timer"){S.countRun=!S.countRun;render();return}
 if(b.dataset.ui==="sw"){S.swRun=!S.swRun;render();return}
 if(b.dataset.ui==="lap"){render();return}
 if(b.dataset.ui==="reward-close"){S.reward=null;S.rewardShiny=false;S.screen="dex";render();return}
 if(b.dataset.ui==="set-scanned-partner"){S.partner=94;S.bond=Math.min(100,S.bond+3);S.screen="home";render();return}
 if(b.dataset.ui==="birthday-ribbon"){if(!S.badges.includes("WISH"))S.badges.push("WISH");S.bond=Math.min(100,S.bond+10);S.screen="trainer";render();return}
 if(b.dataset.ui==="close-bday"){S.screen="home";render();return}
});
setInterval(()=>{
 let d=false;
 if(S.focusRun&&S.focus>0){S.focus--;d=S.screen==="focus";if(S.focus===0){S.focusRun=false;studyReward();d=true}}
 if(S.countRun&&S.count>0){S.count--;d=d||S.screen==="timer"}
 if(S.swRun){S.sw++;d=d||S.screen==="stopwatch"}
 if(d)render();
},1000);
window.addEventListener("error",e=>{$("health").textContent="ERROR";$("state").textContent="runtime error: "+e.message});
render();
})();
</script>
</body>
</html>
