<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokéDock Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#1f232b;color:#f4f4f1;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.wrap{max-width:1160px;margin:auto;padding:16px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.head h1{font-size:21px;margin:0}.health{font:11px ui-monospace,monospace;color:#7fe094}
.layout{display:grid;grid-template-columns:150px minmax(0,1fr) 185px;gap:12px}.panel{background:#292e37;border:1px solid #3a414c;border-radius:15px;padding:9px}
.nav button,.controls button{width:100%;border:1px solid transparent;background:#343a45;color:#d9dde3;border-radius:9px;padding:9px;margin:3px 0;text-align:left;font-size:11px;cursor:pointer;touch-action:manipulation}
.nav button.active{background:#f3f1eb;color:#22252a;font-weight:800}.controls button:active{background:#4b5360;transform:translateY(1px)}
.shell{background:#e8e8e5;border-radius:20px;padding:10px;box-shadow:0 20px 40px #0005}.screen{aspect-ratio:5/3;background:#f7f3e9;color:#24262c;border-radius:13px;overflow:hidden;position:relative}
.screen.dark{background:#181720;color:#f6f4fb}.bar{height:12%;display:flex;justify-content:space-between;align-items:center;padding:0 3%;font-size:11px}.content{height:76%;padding:2.5%;display:grid;grid-template-columns:1.5fr .9fr;gap:2%}
.card{background:rgba(255,255,255,.82);border-radius:15px;padding:4%;overflow:hidden}.dark .card{background:#ffffff10}.time{font-size:clamp(35px,7vw,66px);font-weight:900;letter-spacing:-.06em}.big{font-size:clamp(40px,8vw,76px);font-weight:900;letter-spacing:-.05em}.sub{color:#74777e;font-size:12px}.dark .sub{color:#aaa6b1}
.stack{display:grid;grid-template-rows:repeat(4,1fr);gap:4%}.mini b{display:block}.mini span{font-size:11px;color:#74777e}.bottom{height:12%;border-top:1px solid #0001;display:flex;align-items:center;justify-content:center;gap:5px}
.bottom button{border:0;background:transparent;padding:6px 9px;border-radius:8px;color:#777;font-size:10px}.bottom button.active{background:#fff;color:#222;font-weight:800}.dark .bottom button.active{background:#ffffff18;color:white}
.alert{position:absolute;right:3%;top:13%;z-index:5;background:#20242de8;color:white;border-radius:9px;padding:9px 11px;min-width:180px}.alert b{display:block;font-size:11px}.alert span{font-size:10px;color:#c9cdd3}
.state{margin-top:9px;padding:9px;background:#15181e;border-radius:9px;color:#9ea6b1;font:10px/1.5 ui-monospace,monospace;white-space:pre-line}.badge{display:inline-block;padding:4px 7px;background:#e8eef4;color:#42576d;border-radius:999px;font-size:9px}
.list{display:grid;gap:7px}.row{padding:9px;background:#ffffffaa;border-radius:9px;font-size:11px}.dark .row{background:#ffffff10}.birthday{height:100%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#30416f,#111827 70%);color:white}.birthday h2{font-size:28px;margin:8px}
.phone{width:68px;height:124px;border-radius:13px;background:#222831;margin:auto;display:grid;place-items:center;color:#7fe094;font-size:27px}.ok{color:#7fe094}.off{color:#e0aa82}
button[data-ui]{border:0;border-radius:8px;padding:8px 12px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;font-size:9px}.controls{display:grid;grid-template-columns:repeat(2,1fr)}.controls h3,.state{grid-column:1/-1}.shell{padding:6px}.bar{font-size:8px}.mini span{font-size:9px}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><h1>PokéDock UI Simulator</h1><span class="health" id="health">BOOTING</span></div>
<div class="layout">
  <aside class="panel nav" id="nav"></aside>
  <main><div class="shell"><div class="screen" id="screen"></div></div></main>
  <aside class="panel controls" id="controls">
    <h3 style="font-size:12px;margin:4px 4px 8px">State simulator</h3>
    <button data-action="phone">폰 거치 토글</button>
    <button data-action="ble">BLE 연결/해제</button>
    <button data-action="call">BLE · 전화 알림</button>
    <button data-action="calendar">BLE · 일정 알림</button>
    <button data-action="contact">BLE · 중요 연락처</button>
    <button data-action="dark">Night 토글</button>
    <button data-action="nfc">NFC 스캔</button>
    <button data-action="birthday">Birthday 이벤트</button>
    <button data-action="reset">상태 초기화</button>
    <div class="state" id="state">booting…</div>
  </aside>
</div>
</div>
<script>
(function(){
"use strict";
const S={screen:"home",phone:true,ble:true,dark:false,notice:null,nfc:false,focus:1500,focusRun:false,count:600,countRun:false,sw:1938,swRun:false,clicks:0};
const ids=["home","focus","timer","stopwatch","today","dex","phone","weather","alarm","light","settings","birthday","night"];
const L={home:"HOME",focus:"FOCUS",timer:"TIMER",stopwatch:"STOPWATCH",today:"TODAY",dex:"DEX",phone:"PHONE",weather:"WEATHER",alarm:"ALARM",light:"LIGHT",settings:"SETTINGS",birthday:"BIRTHDAY",night:"NIGHT"};
const $=id=>document.getElementById(id);
const fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function notice(){if(!S.notice)return "";const m={call:["CALL · 엄마","수신 전화"],calendar:["CALENDAR","15분 뒤 일정"],contact:["PRIORITY","선택 연락처 · 본문 숨김"]}[S.notice];return '<div class="alert"><b>'+m[0]+'</b><span>'+m[1]+'</span></div>'}
function top(){return '<div class="bar"><b>POKÉDOCK</b><span>Wi-Fi ● · '+(S.ble?"BLE ●":"BLE ○")+' · '+(S.phone?"PHONE ●":"PHONE ○")+'</span></div>'}
function bottom(active){return '<div class="bottom">'+["home","focus","timer","today","dex"].map(x=>'<button data-screen="'+x+'" class="'+(active===x?"active":"")+'">'+L[x]+'</button>').join("")+'</div>'}
function shell(body,active,dark){return '<div style="height:100%" class="'+(dark?"dark":"")+'">'+top()+'<div class="content">'+body+'</div>'+bottom(active)+notice()+'</div>'}
function home(){return shell('<div class="card"><div class="time">14:36</div><div class="sub">10월 5일 · 월요일</div><h3 style="margin-top:38px">오늘도 차근차근.</h3><div class="sub">Study companion · Calm mode</div></div><div class="stack"><div class="card mini"><b>오늘 공부</b><span>1h45m / 3h</span></div><div class="card mini"><b>D-DAY</b><span>확률 과제 D-4</span></div><div class="card mini"><b>날씨</b><span>18°C 맑음</span></div><div class="card mini"><b>다음</b><span>복습 25분</span></div></div>',"home",S.dark)}
function focus(){return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="badge">FOCUS SESSION</div><div class="big">'+fmt(S.focus)+'</div><button data-ui="focus">'+(S.focusRun?"PAUSE":"START")+'</button></div></div><div class="card"><h3>Lucario Focus</h3><p class="sub">일반 알림 차단 · 중요 알림만 표시</p></div>',"focus",S.dark)}
function timer(){return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="badge">COUNTDOWN</div><div class="big">'+fmt(S.count)+'</div><button data-ui="timer">'+(S.countRun?"PAUSE":"START")+'</button></div></div><div class="card"><h3>Presets</h3><div class="list"><div class="row">5분</div><div class="row">10분</div><div class="row">30분</div></div></div>',"timer",S.dark)}
function stopwatch(){return shell('<div class="card" style="display:grid;place-items:center;text-align:center"><div><div class="badge">STOPWATCH</div><div class="big">'+fmt(S.sw)+'</div><button data-ui="sw">'+(S.swRun?"PAUSE":"START")+'</button></div></div><div class="card"><h3>Laps</h3><div class="list"><div class="row">Lap 3 · 32:18</div><div class="row">Lap 2 · 21:04</div><div class="row">Lap 1 · 10:12</div></div></div>',"timer",S.dark)}
function today(){return shell('<div class="card"><h3>TODAY</h3><div class="list"><div class="row">✓ 신호 복습 25분</div><div class="row">확률 과제 · 18:00</div><div class="row">영단어 20개 · 20:30</div></div></div><div class="card"><div class="big">1h45m</div><div class="sub">3 sessions · 4-day streak</div></div>',"today",S.dark)}
function dex(){return shell('<div class="card"><h3>DEX</h3><p class="sub">11 / 18 발견</p><div class="list"><div class="row">✓ Gengar · Togepi · Pachirisu</div><div class="row">✓ Lucario · Togekiss · Jirachi</div><div class="row">○ Eevee · Mimikyu</div></div></div><div class="card"><h3>Reward</h3><p class="sub">다음 encounter까지 Focus 1회</p></div>',"dex",S.dark)}
function phone(){return shell('<div class="card" style="display:grid;place-items:center"><div class="phone">⚡</div></div><div class="card"><h3>Phone Bridge</h3><p class="'+(S.ble?"ok":"off")+'">'+(S.ble?"BLE connected":"BLE disconnected")+'</p><div class="list"><div class="row">CALL · allow</div><div class="row">CALENDAR · allow</div><div class="row">PRIORITY CONTACT · allow</div><div class="row">Social · suppress</div></div></div>',"home",S.dark)}
function simple(name,text){return shell('<div class="card"><div class="big">'+name+'</div><p class="sub">'+text+'</p></div><div class="card"><h3>Status</h3><p class="sub">UI concept screen</p></div>',"home",S.dark)}
function birthday(){return '<div class="birthday"><div><div class="badge">SPECIAL EVENT</div><h2>A SPECIAL EVENT HAS STARTED.</h2><p>Birthday mode · Jirachi event</p><button data-ui="close-bday">포켓몬 센터 열기</button></div></div>'}
function render(){const F={home,focus,timer,stopwatch,today,dex,phone,weather:()=>simple("18°","맑음 · 4시간 예보"),alarm:()=>simple("07:30","RTC 기반 알람"),light:()=>simple("LIGHT","Warm · Calm · Night"),settings:()=>simple("SETTINGS","Wi-Fi · Night · Phone Bridge"),birthday,night:()=>{const o=S.dark;S.dark=true;const x=home();S.dark=o;return x}};$("screen").innerHTML=(F[S.screen]||home)();$("screen").classList.toggle("dark",S.dark||S.screen==="night");$("state").textContent="clicks: "+S.clicks+"\nscreen: "+S.screen+"\nphoneParked: "+S.phone+"\nBLE: "+S.ble+"\nnotice: "+(S.notice||"none")+"\nnight: "+S.dark+"\nnfc: "+S.nfc;$("health").textContent="RUNNING";drawNav()}
function drawNav(){$("nav").innerHTML=ids.map(x=>'<button data-screen="'+x+'" class="'+(S.screen===x?"active":"")+'">'+L[x]+'</button>').join("")}
function act(a){S.clicks++;if(a==="phone")S.phone=!S.phone;else if(a==="ble")S.ble=!S.ble;else if(a==="call"){S.ble=true;S.notice="call";S.screen="phone"}else if(a==="calendar"){S.ble=true;S.notice="calendar";S.screen="phone"}else if(a==="contact"){S.ble=true;S.notice="contact";S.screen="phone"}else if(a==="dark")S.dark=!S.dark;else if(a==="nfc"){S.nfc=!S.nfc;S.screen="dex"}else if(a==="birthday")S.screen="birthday";else if(a==="reset")Object.assign(S,{screen:"home",phone:true,ble:true,dark:false,notice:null,nfc:false,focus:1500,focusRun:false,count:600,countRun:false,sw:1938,swRun:false,clicks:S.clicks});render()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.action){act(b.dataset.action);return}if(b.dataset.screen){S.screen=b.dataset.screen;render();return}if(b.dataset.ui==="focus"){S.focusRun=!S.focusRun;render();return}if(b.dataset.ui==="timer"){S.countRun=!S.countRun;render();return}if(b.dataset.ui==="sw"){S.swRun=!S.swRun;render();return}if(b.dataset.ui==="close-bday"){S.screen="home";render();return}});
setInterval(()=>{let d=false;if(S.focusRun&&S.focus>0){S.focus--;d=S.screen==="focus"}if(S.countRun&&S.count>0){S.count--;d=d||S.screen==="timer"}if(S.swRun){S.sw++;d=d||S.screen==="stopwatch"}if(d)render()},1000);
window.addEventListener("error",e=>{$("health").textContent="ERROR";$("state").textContent="runtime error: "+e.message});
render();
})();
</script>
</body>
</html>
